<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Usage Tracker</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .glow  { box-shadow: 0 0 30px rgba(56,189,248,0.15); }
        .mono  { font-family: 'Courier New', monospace; }
        .fade-in { animation: fadeIn 0.4s ease-out both; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

/* ── IndexedDB ──────────────────────────────────────────────────────────── */
const DB_NAME = 'SophosTrackerDB';
const DB_VERSION = 1;
const STORE_HIST = 'historicalData';
const STORE_CFG  = 'configurations';

const initDB = () => new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => rej(req.error);
    req.onsuccess = () => res(req.result);
    req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_HIST)) db.createObjectStore(STORE_HIST, { keyPath: 'monthLabel' });
        if (!db.objectStoreNames.contains(STORE_CFG))  db.createObjectStore(STORE_CFG,  { keyPath: 'id' });
    };
});

const dbOp = async (store, mode, fn) => {
    const db = await initDB();
    return new Promise((res, rej) => {
        const tx = db.transaction([store], mode);
        const s  = tx.objectStore(store);
        const r  = fn(s);
        r.onsuccess = () => res(r.result);
        r.onerror   = () => rej(r.error);
    });
};
const dbPut = (store, data) => dbOp(store, 'readwrite', s => s.put(data));
const dbGet = (store, key)  => dbOp(store, 'readonly',  s => s.get(key));
const dbAll = (store)       => dbOp(store, 'readonly',  s => s.getAll());
const dbDel = (store, key)  => dbOp(store, 'readwrite', s => s.delete(key));

/* ── Utilities ──────────────────────────────────────────────────────────── */
const parseMonthLabel = (label) => {
    const m = label.match(/Sophos-(\d{2})(\d{2})/);
    return m ? new Date(2000 + parseInt(m[2], 10), parseInt(m[1], 10) - 1) : null;
};
const fmtMonth = (label) => {
    const d = parseMonthLabel(label);
    return d ? d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) : label;
};
const getLast12 = (hist) =>
    Object.keys(hist)
        .map(label => ({ label, date: parseMonthLabel(label) }))
        .filter(x => x.date)
        .sort((a, b) => b.date - a.date)
        .slice(0, 12)
        .reverse();

/* ── CSV Parser ─────────────────────────────────────────────────────────── */
const parseCSV = (text) => {
    const rows = text.split('\n').map(r => r.trim()).filter(Boolean);
    if (rows.length < 2) return { error: 'CSV must have at least a header and one data row.' };

    const delim = rows[0].includes('\t') ? '\t' : ',';
    const parseRow = (row) => {
        if (delim === '\t') return row.split('\t').map(c => c.trim());
        const out = []; let cur = '', inQ = false;
        for (const ch of row) {
            if (ch === '"') { inQ = !inQ; }
            else if (ch === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
            else cur += ch;
        }
        out.push(cur.trim());
        return out;
    };

    const headers = parseRow(rows[0]);
    const find = (...names) => {
        for (const n of names) {
            const i = headers.findIndex(h => h.toLowerCase() === n.toLowerCase());
            if (i !== -1) return i;
        }
        return -1;
    };

    const ci = find('End User Name', 'Client', 'Customer', 'End User');
    const si = find('Sku', 'SKU', 'Product SKU');
    const qi = find('Qty', 'Quantity');
    const ei = find('Ext Price', 'Extended Price', 'Total Price', 'Total', 'Cost');
    const sni = find('Serial Number', 'Serial', 'License Serial');
    const di  = find('Description', 'Product Description', 'Item Description');

    if (ci === -1 || si === -1 || qi === -1 || ei === -1)
        return { error: `Missing required columns. Found: ${headers.join(', ')}` };

    const data = [];
    for (let i = 1; i < rows.length; i++) {
        const cols = parseRow(rows[i]);
        if (cols.length < 4) continue;
        const client = cols[ci] || '';
        const sku    = cols[si] || '';
        const qty    = parseFloat(cols[qi]) || 0;
        const cost   = parseFloat(cols[ei]) || 0;
        const serial = sni !== -1 ? (cols[sni] || '') : '';
        const desc   = di  !== -1 ? (cols[di]  || '') : '';
        if (client && sku) data.push({ client, sku, qty, cost, serial, description: desc });
    }
    return { data };
};

/* ── Icons ──────────────────────────────────────────────────────────────── */
const Ico = ({ d, className }) => (
    <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={d} />
    </svg>
);
const IcoUpload   = ({ className }) => <Ico className={className} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />;
const IcoDownload = ({ className }) => <Ico className={className} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />;
const IcoCal     = ({ className }) => <Ico className={className} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />;
const IcoUp      = ({ className }) => <Ico className={className} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />;
const IcoDown    = ({ className }) => <Ico className={className} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />;

/* ── Sparkline ──────────────────────────────────────────────────────────── */
// Shows historical monthly quantities + the current uploaded value as the final point.
// Green = trending up, red = trending down, gray = flat/no data.
const Sparkline = ({ monthlyQty, months, currentQty, w = 90, h = 28 }) => {
    const hist = months.map(({ label }) => monthlyQty[label] || 0);
    const vals = currentQty !== undefined ? [...hist, currentQty] : hist;

    if (vals.length < 2 || vals.every(v => v === 0))
        return <span className="text-slate-600 text-xs">—</span>;

    const maxV = Math.max(...vals, 1);
    const pad = 3, iw = w - pad * 2, ih = h - pad * 2;

    const pts = vals.map((v, i) => [
        pad + (i / (vals.length - 1)) * iw,
        pad + ih - (v / maxV) * ih
    ]);

    const polyPts  = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const [lx, ly] = pts[pts.length - 1];
    const lastV    = vals[vals.length - 1];
    const prevV    = vals[vals.length - 2];
    const color    = lastV > prevV ? '#34d399' : lastV < prevV ? '#f87171' : '#94a3b8';

    // Closed area polygon for fill
    const areaPts = `${pad},${pad + ih} ${polyPts} ${lx.toFixed(1)},${pad + ih}`;

    return (
        <svg width={w} height={h} style={{ verticalAlign: 'middle', overflow: 'visible' }}>
            <polygon points={areaPts} fill={color} fillOpacity="0.12" />
            <polyline points={polyPts} fill="none" stroke={color} strokeWidth="1.5"
                strokeLinejoin="round" strokeLinecap="round" />
            <circle cx={lx.toFixed(1)} cy={ly.toFixed(1)} r="2.5" fill={color} />
        </svg>
    );
};

/* ── Main Component ─────────────────────────────────────────────────────── */
const SophosUsageTracker = () => {
    const [invoiceData,     setInvoiceData]     = useState([]);
    const [clientSkuConfig, setClientSkuConfig] = useState([]);
    const [newClientSku,    setNewClientSku]    = useState({ clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0 });
    const [uploadError,     setUploadError]     = useState('');
    const [currentMonthLabel, setCurrentMonthLabel] = useState('');
    const [historicalData,  setHistoricalData]  = useState({});
    const [configExpanded,  setConfigExpanded]  = useState(true);
    const [clientFilter,    setClientFilter]    = useState('');
    const [serialConfig,    setSerialConfig]    = useState([]);
    const [newSerial,       setNewSerial]       = useState({ serialNumber: '', expectedClient: '', description: '' });
    const [serialExpanded,  setSerialExpanded]  = useState(true);
    const [bulkProgress,    setBulkProgress]    = useState('');
    const [markupPct,       setMarkupPct]       = useState(40);
    const [saveStatus,      setSaveStatus]      = useState('');
    const [centralCatalog,  setCentralCatalog]  = useState(null); // { generatedAt, productNames, tenants }

    /* ── Load from IndexedDB on mount ──────────────────────────────────── */
    useEffect(() => {
        (async () => {
            // Historical snapshots
            const all = await dbAll(STORE_HIST);
            if (all && all.length > 0) {
                const obj = {};
                all.forEach(item => { obj[item.monthLabel] = item.data; });
                setHistoricalData(obj);
            } else {
                // One-time migration from localStorage
                const lsSaved = localStorage.getItem('sophosHistoricalData');
                if (lsSaved) {
                    try {
                        const parsed = JSON.parse(lsSaved);
                        setHistoricalData(parsed);
                        for (const [monthLabel, data] of Object.entries(parsed))
                            await dbPut(STORE_HIST, { monthLabel, data });
                    } catch (e) { console.error('History migration error:', e); }
                }
            }

            // Client SKU config
            const cfg = await dbGet(STORE_CFG, 'clientSkuConfig');
            if (cfg) {
                setClientSkuConfig(cfg.data || []);
            } else {
                const ls = localStorage.getItem('sophosClientSkuConfig');
                if (ls) {
                    try {
                        const parsed = JSON.parse(ls);
                        setClientSkuConfig(parsed);
                        await dbPut(STORE_CFG, { id: 'clientSkuConfig', data: parsed });
                    } catch (e) { console.error('Config migration error:', e); }
                }
            }

            // Central catalog
            const cat = await dbGet(STORE_CFG, 'centralCatalog');
            if (cat) setCentralCatalog(cat.data);

            // Serial config
            const scfg = await dbGet(STORE_CFG, 'serialConfig');
            if (scfg) {
                setSerialConfig(scfg.data || []);
            } else {
                const ls = localStorage.getItem('sophosSerialConfig');
                if (ls) {
                    try {
                        const parsed = JSON.parse(ls);
                        setSerialConfig(parsed);
                        await dbPut(STORE_CFG, { id: 'serialConfig', data: parsed });
                    } catch (e) { console.error('Serial config migration error:', e); }
                }
            }
        })();
    }, []);

    /* ── Persist configs on change ─────────────────────────────────────── */
    useEffect(() => { dbPut(STORE_CFG, { id: 'clientSkuConfig', data: clientSkuConfig }); }, [clientSkuConfig]);
    useEffect(() => { dbPut(STORE_CFG, { id: 'serialConfig',    data: serialConfig    }); }, [serialConfig]);

    /* ── File upload ───────────────────────────────────────────────────── */
    const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadError('');
        const reader = new FileReader();
        reader.onload = (ev) => {
            const { data, error } = parseCSV(ev.target.result);
            if (error) { setUploadError(error); return; }
            setInvoiceData(data);
            // Auto-fill month label from filename if empty
            const m = file.name.match(/sophos[-_]?(\d{4})/i);
            if (m && !currentMonthLabel) setCurrentMonthLabel(`Sophos-${m[1]}`);
        };
        reader.readAsText(file);
    };

    /* ── Bulk upload ───────────────────────────────────────────────────── */
    const readFileText = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = (ev) => resolve(ev.target.result);
        reader.onerror = ()  => reject(new Error(`Could not read ${file.name}`));
        reader.readAsText(file);
    });

    const handleBulkUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        const skipped = [];
        setBulkProgress(`Processing ${files.length} files...`);
        let ok = 0, fail = 0;

        for (const file of files) {
            const m = file.name.match(/sophos[-_]?(\d{4})/i);
            if (!m) {
                skipped.push(`${file.name} (name must match sophos-MMYY.csv)`);
                fail++;
                continue;
            }
            const monthLabel = `Sophos-${m[1]}`;
            try {
                const text = await readFileText(file);
                const { data, error } = parseCSV(text);
                if (error || !data) {
                    skipped.push(`${file.name} (parse error: ${error || 'no data'})`);
                    fail++;
                    continue;
                }
                const snapshot = {};
                data.forEach(({ client, sku, qty }) => {
                    if (client && sku) snapshot[`${client}|||${sku}`] = qty;
                });
                await dbPut(STORE_HIST, { monthLabel, data: snapshot });
                ok++;
            } catch (err) {
                skipped.push(`${file.name} (${err.message})`);
                fail++;
            }
            setBulkProgress(`Processed ${ok + fail}/${files.length}...`);
        }

        const all = await dbAll(STORE_HIST);
        const obj = {};
        all.forEach(item => { obj[item.monthLabel] = item.data; });
        setHistoricalData(obj);

        if (skipped.length > 0) {
            setBulkProgress(`Done: ${ok} saved, ${fail} skipped — ${skipped.join(' | ')}`);
        } else {
            setBulkProgress(`Done: ${ok} saved successfully`);
        }
        setTimeout(() => setBulkProgress(''), 15000);
    };

    /* ── Save current month ────────────────────────────────────────────── */
    const handleSaveMonth = async () => {
        if (!currentMonthLabel) { alert('Enter a month label (e.g., Sophos-0126)'); return; }
        const snapshot = {};
        invoiceData.forEach(({ client, sku, qty }) => { snapshot[`${client}|||${sku}`] = qty; });
        await dbPut(STORE_HIST, { monthLabel: currentMonthLabel, data: snapshot });
        setHistoricalData(prev => ({ ...prev, [currentMonthLabel]: snapshot }));
        setSaveStatus(`Saved ${currentMonthLabel}`);
        setTimeout(() => setSaveStatus(''), 3000);
    };

    /* ── Auto-populate config from CSV ────────────────────────────────── */
    const handleAutoPopulate = () => {
        if (!invoiceData.length) return;
        const existing = new Set(clientSkuConfig.map(c => `${c.clientName}|||${c.sku}`));
        const newCfgs = [];
        invoiceData.forEach(({ client, sku, description, qty, cost }) => {
            const key = `${client}|||${sku}`;
            if (!existing.has(key)) {
                const unitCost = qty > 0 ? cost / qty : 0;
                // CSV description is the best source; catalog product names are a fallback
                let desc = description || '';
                if (!desc && centralCatalog) {
                    const tenantProds = centralCatalog.tenants[client] || [];
                    const catalogMatch = tenantProds.find(p =>
                        centralCatalog.productNames[p.productCode] &&
                        (sku.includes(p.productCode.replace(/-MSP$/, '').replace(/-SUP$/, '')) || p.productCode.length > 4)
                    );
                    if (catalogMatch) desc = centralCatalog.productNames[catalogMatch.productCode] || '';
                }
                newCfgs.push({
                    clientName: client, sku, description: desc,
                    trackUsage: true, expectedQty: qty,
                    billingRate: Math.round(unitCost * (1 + markupPct / 100) * 100) / 100
                });
                existing.add(key);
            }
        });
        if (newCfgs.length) {
            setClientSkuConfig(prev => [...prev, ...newCfgs]);
            alert(`Added ${newCfgs.length} entries with ${markupPct}% markup.`);
        } else {
            alert('All CSV entries are already configured.');
        }
    };

    /* ── Build config from historical data ────────────────────────────── */
    const handleBuildFromHistory = () => {
        if (!Object.keys(historicalData).length) return;
        const existing = new Set(clientSkuConfig.map(c => `${c.clientName}|||${c.sku}`));
        const newCfgs = [];

        // Collect all unique client+sku keys across all months, tracking most recent qty
        const keyMap = {}; // key -> { latestQty, monthsSeen }
        const sortedMonths = Object.keys(historicalData)
            .map(label => ({ label, date: parseMonthLabel(label) }))
            .filter(m => m.date)
            .sort((a, b) => a.date - b.date);

        sortedMonths.forEach(({ label }) => {
            const snapshot = historicalData[label];
            Object.entries(snapshot).forEach(([key, qty]) => {
                if (!keyMap[key]) keyMap[key] = { latestQty: qty };
                else keyMap[key].latestQty = qty; // later month overwrites → most recent
            });
        });

        Object.entries(keyMap).forEach(([key, { latestQty }]) => {
            if (existing.has(key)) return;
            const [clientName, sku] = key.split('|||');
            if (!clientName || !sku) return;
            newCfgs.push({
                clientName, sku, description: '',
                trackUsage: true, expectedQty: latestQty, billingRate: 0
            });
            existing.add(key);
        });

        if (newCfgs.length) {
            setClientSkuConfig(prev => [...prev, ...newCfgs]);
            alert(`Added ${newCfgs.length} entries from history. Set billing rates to enable revenue tracking.`);
        } else {
            alert('All historical client/SKU combinations are already configured.');
        }
    };

    /* ── Central catalog import ───────────────────────────────────────── */
    const handleImportCatalog = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!data.tenants || !data.productNames) {
                    alert('Invalid catalog file — expected generatedAt, productNames, tenants fields.');
                    return;
                }
                setCentralCatalog(data);
                await dbPut(STORE_CFG, { id: 'centralCatalog', data });
                alert(`Catalog loaded: ${Object.keys(data.tenants).length} tenants, generated ${data.generatedAt}`);
            } catch (err) {
                alert('Error parsing catalog: ' + err.message);
            }
        };
        reader.readAsText(file);
    };

    /* ── Export helper ─────────────────────────────────────────────────── */
    const downloadJSON = (obj, filename) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
        a.download = filename;
        a.click();
    };
    const importJSON = (e, setter) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => { try { setter(JSON.parse(ev.target.result)); } catch {} };
        r.readAsText(file);
    };

    /* ── Computed data ─────────────────────────────────────────────────── */
    const rolling12 = useMemo(() => getLast12(historicalData), [historicalData]);

    const serialValidation = useMemo(() => {
        if (!invoiceData.length || !serialConfig.length) return [];
        return serialConfig.flatMap(cfg => {
            const matches = invoiceData.filter(i => i.serial === cfg.serialNumber);
            if (!matches.length) return [{ ...cfg, actualClient: null, status: 'missing', sku: null }];
            return matches.map(m => ({
                ...cfg, actualClient: m.client, sku: m.sku,
                status: m.client === cfg.expectedClient ? 'correct' : 'mismatch'
            }));
        });
    }, [invoiceData, serialConfig]);

    const analysisData = useMemo(() => {
        if (!clientSkuConfig.length) return [];
        return clientSkuConfig
            .filter(cfg => cfg.trackUsage)
            .map(cfg => {
                const inv        = invoiceData.find(i => i.client === cfg.clientName && i.sku === cfg.sku);
                const actualQty  = inv ? inv.qty  : 0;
                const actualCost = inv ? inv.cost : 0;
                const variance   = actualQty - (cfg.expectedQty || 0);
                const revenue    = actualQty * (cfg.billingRate || 0);
                const margin     = revenue - actualCost;
                const revenueAdj = variance * (cfg.billingRate || 0);

                const monthlyQty = {};
                rolling12.forEach(({ label }) => {
                    const snap = historicalData[label] || {};
                    monthlyQty[label] = snap[`${cfg.clientName}|||${cfg.sku}`] || 0;
                });

                const hasData = actualQty > 0 || Object.values(monthlyQty).some(q => q > 0);
                if (!hasData) return null;

                return {
                    clientName: cfg.clientName, sku: cfg.sku,
                    description: cfg.description, expectedQty: cfg.expectedQty,
                    billingRate: cfg.billingRate, actualQty, actualCost,
                    variance, revenueAdj, margin, monthlyQty
                };
            })
            .filter(Boolean);
    }, [invoiceData, clientSkuConfig, historicalData, rolling12]);

    const filteredData = useMemo(() => {
        if (!clientFilter) return analysisData;
        const lo = clientFilter.toLowerCase();
        return analysisData.filter(r =>
            r.clientName.toLowerCase().includes(lo) ||
            (r.description || '').toLowerCase().includes(lo) ||
            r.sku.toLowerCase().includes(lo)
        );
    }, [analysisData, clientFilter]);

    const totals = useMemo(() =>
        filteredData.reduce((acc, r) => ({
            rev:    acc.rev    + r.revenueAdj,
            cost:   acc.cost   + r.actualCost,
            margin: acc.margin + r.margin
        }), { rev: 0, cost: 0, margin: 0 }),
    [filteredData]);

    /* ── Render ─────────────────────────────────────────────────────────── */
    const histCount = Object.keys(historicalData).length;

    return (
        <div className="min-h-screen p-4 md:p-6">
            <div className="max-w-[98%] mx-auto space-y-6">

                {/* ── Header ── */}
                <div className="glass rounded-2xl p-8 glow fade-in">
                    <div className="flex items-center gap-4 mb-2">
                        <IcoCal className="w-10 h-10 text-sky-400" />
                        <h1 className="text-4xl font-bold text-white">Sophos Usage Tracker</h1>
                    </div>
                    <p className="text-sky-200 text-lg">Rolling 12-Month Analysis &amp; QuickBooks Adjustment Calculator</p>
                    {histCount > 0 && (
                        <p className="mt-2 text-sm text-sky-300/60">
                            {histCount} month(s) stored in IndexedDB — history persists across reloads
                        </p>
                    )}
                </div>

                {/* ── Upload ── */}
                <div className="glass rounded-2xl p-6 fade-in" style={{ animationDelay: '0.1s' }}>
                    <h2 className="text-xl font-semibold text-white mb-4 flex items-center gap-2">
                        <IcoUpload className="w-5 h-5 text-sky-400" />
                        Upload Invoice CSV
                    </h2>
                    <div className="space-y-4">
                        <div className="flex flex-wrap gap-4 items-end">
                            <div className="flex-1 min-w-[220px]">
                                <label className="block text-sm text-sky-200 mb-2">CSV File (End User Name, Sku, Qty, Ext Price)</label>
                                <input type="file" accept=".csv,.txt,.tsv" onChange={handleFileUpload}
                                    className="w-full px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-sky-400" />
                            </div>
                            <div className="flex-1 min-w-[180px]">
                                <label className="block text-sm text-sky-200 mb-2 mono">Month Label (e.g., Sophos-0126)</label>
                                <input type="text" value={currentMonthLabel}
                                    onChange={e => setCurrentMonthLabel(e.target.value)}
                                    placeholder="Sophos-0126"
                                    className="w-full px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white mono focus:outline-none focus:ring-2 focus:ring-sky-400" />
                            </div>
                            <button onClick={handleSaveMonth}
                                disabled={!invoiceData.length || !currentMonthLabel}
                                className="px-6 py-2 bg-sky-600 hover:bg-sky-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-lg font-medium transition-colors">
                                Save Month
                            </button>
                        </div>

                        {uploadError && <div className="p-3 bg-red-900/30 border border-red-500 rounded-lg text-red-200 text-sm">{uploadError}</div>}
                        {saveStatus  && <div className="p-3 bg-emerald-900/30 border border-emerald-500 rounded-lg text-emerald-200 text-sm">✓ {saveStatus}</div>}
                        {invoiceData.length > 0 && (
                            <div className="p-3 bg-emerald-900/30 border border-emerald-500 rounded-lg text-emerald-200 text-sm">
                                Loaded {invoiceData.length} invoice items
                            </div>
                        )}

                        {/* Bulk Upload */}
                        <div className="border-t border-slate-600 pt-4">
                            <h3 className="text-lg font-semibold text-white mb-3 flex items-center gap-2">
                                <IcoCal className="w-5 h-5 text-sky-400" />
                                Bulk Upload — Multiple Months
                            </h3>
                            <label className="cursor-pointer block">
                                <div className="p-6 bg-slate-800/50 rounded-lg border-2 border-dashed border-slate-600 hover:border-sky-500 transition-colors text-center">
                                    <IcoUpload className="w-8 h-8 mx-auto text-sky-400 mb-2" />
                                    <p className="text-white font-medium mb-1">Select multiple CSV files</p>
                                    <p className="text-slate-400 text-sm">Files must be named sophos-MMYY.csv (e.g., sophos-0125.csv)</p>
                                </div>
                                <input type="file" multiple accept=".csv" onChange={handleBulkUpload} className="hidden" />
                            </label>
                            {bulkProgress && (
                                <div className={`mt-3 p-3 rounded-lg text-sm ${bulkProgress.startsWith('Done') ? 'bg-emerald-900/30 border border-emerald-500 text-emerald-200' : 'bg-blue-900/30 border border-blue-500 text-blue-200'}`}>
                                    {bulkProgress}
                                </div>
                            )}
                        </div>

                        {/* Central Catalog status */}
                        <div className="border-t border-slate-600 pt-4 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className={`w-2.5 h-2.5 rounded-full ${centralCatalog ? 'bg-emerald-400' : 'bg-slate-600'}`} />
                                <span className="text-sm text-slate-300">
                                    {centralCatalog
                                        ? <>Central Catalog loaded — <span className="text-sky-300">{Object.keys(centralCatalog.tenants).length} tenants</span>, generated <span className="mono text-slate-400">{centralCatalog.generatedAt}</span></>
                                        : 'No Central Catalog loaded — import central_catalog.json to enable tenant autocomplete'}
                                </span>
                            </div>
                            <label className="px-4 py-2 bg-indigo-700 hover:bg-indigo-600 text-white rounded-lg cursor-pointer transition-colors text-sm whitespace-nowrap">
                                {centralCatalog ? 'Update Catalog' : 'Load Central Catalog'}
                                <input type="file" accept=".json" className="hidden" onChange={handleImportCatalog} />
                            </label>
                        </div>
                    </div>
                </div>

                {/* ── Client SKU Config ── */}
                <div className="glass rounded-2xl p-6 fade-in" style={{ animationDelay: '0.2s' }}>
                    <div className="flex justify-between items-center mb-4 flex-wrap gap-3">
                        <h2 className="text-xl font-semibold text-white">Client SKU Configuration</h2>
                        <div className="flex gap-2 items-center flex-wrap">
                            <div className="flex items-center gap-2">
                                <label className="text-sm text-sky-200">Markup %:</label>
                                <input type="number" value={markupPct} min={0} max={500}
                                    onChange={e => setMarkupPct(parseFloat(e.target.value) || 0)}
                                    className="w-20 px-2 py-1 bg-slate-800 border border-slate-600 rounded text-white text-sm mono focus:outline-none focus:ring-2 focus:ring-sky-400" />
                            </div>
                            {Object.keys(historicalData).length > 0 && (
                                <button onClick={handleBuildFromHistory}
                                    className="px-4 py-2 bg-violet-600 hover:bg-violet-500 text-white rounded-lg font-medium transition-colors">
                                    📂 Build from History
                                </button>
                            )}
                            {invoiceData.length > 0 && (
                                <button onClick={handleAutoPopulate}
                                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-medium transition-colors">
                                    ⚡ Auto-Populate from CSV
                                </button>
                            )}
                            <label className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg cursor-pointer transition-colors">
                                Import Config
                                <input type="file" accept=".json" className="hidden"
                                    onChange={e => importJSON(e, setClientSkuConfig)} />
                            </label>
                            <button onClick={() => downloadJSON(clientSkuConfig, 'sophos-config.json')}
                                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors flex items-center gap-2">
                                <IcoDownload className="w-4 h-4" />Export Config
                            </button>
                            <button onClick={() => setConfigExpanded(x => !x)}
                                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors">
                                {configExpanded ? 'Collapse' : 'Expand'}
                            </button>
                        </div>
                    </div>

                    {configExpanded && (
                        <div className="space-y-4">
                            {/* Add row */}
                            <div className="grid gap-3 p-4 bg-slate-800/50 rounded-lg" style={{ gridTemplateColumns: '2fr 1.5fr 2fr 1fr 1fr 0.8fr 0.8fr' }}>
                                {[['text','Client Name','clientName'],['text','SKU','sku'],['text','Description','description'],
                                  ['number','Exp Qty','expectedQty'],['number','Billing Rate','billingRate']].map(([type, ph, field]) => (
                                    <input key={field} type={type} placeholder={ph}
                                        value={newClientSku[field] || ''}
                                        onChange={e => setNewClientSku(p => ({ ...p, [field]: type === 'number' ? parseFloat(e.target.value) || 0 : e.target.value }))}
                                        className="px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                                ))}
                                <label className="flex items-center gap-2 text-white text-sm px-1">
                                    <input type="checkbox" checked={newClientSku.trackUsage}
                                        onChange={e => setNewClientSku(p => ({ ...p, trackUsage: e.target.checked }))}
                                        className="w-4 h-4" />
                                    Track
                                </label>
                                <button onClick={() => {
                                    if (newClientSku.clientName && newClientSku.sku) {
                                        setClientSkuConfig(p => [...p, { ...newClientSku }]);
                                        setNewClientSku({ clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0 });
                                    }
                                }} className="px-3 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded font-medium transition-colors text-sm">
                                    Add
                                </button>
                            </div>

                            {/* List */}
                            <div className="space-y-2 max-h-96 overflow-y-auto">
                                {clientSkuConfig.map((cfg, i) => (
                                    <div key={i} className="grid gap-3 p-3 bg-slate-800/30 rounded-lg items-center text-sm"
                                        style={{ gridTemplateColumns: '2fr 1.5fr 2fr 1fr 1fr 0.8fr 0.8fr' }}>
                                        <span className="text-white font-medium truncate">{cfg.clientName}</span>
                                        <span className="text-sky-300 mono text-xs truncate">{cfg.sku}</span>
                                        <span className="text-slate-300 truncate">{cfg.description}</span>
                                        <span className="text-slate-300 mono">{cfg.expectedQty}</span>
                                        <span className="text-emerald-300 mono">${cfg.billingRate}</span>
                                        <span className={cfg.trackUsage ? 'text-emerald-300' : 'text-slate-500'}>
                                            {cfg.trackUsage ? '✓ Track' : '✗ Skip'}
                                        </span>
                                        <button onClick={() => setClientSkuConfig(p => p.filter((_, j) => j !== i))}
                                            className="px-3 py-1 bg-red-600/20 hover:bg-red-600/40 text-red-300 rounded transition-colors text-xs">
                                            Remove
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>

                {/* ── Serial Validation ── */}
                <div className="glass rounded-2xl p-6 fade-in" style={{ animationDelay: '0.25s' }}>
                    <div className="flex justify-between items-center mb-4 flex-wrap gap-3">
                        <h2 className="text-xl font-semibold text-white">Serial Number Validation</h2>
                        <div className="flex gap-2">
                            <label className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg cursor-pointer transition-colors">
                                Import Serials
                                <input type="file" accept=".json" className="hidden"
                                    onChange={e => importJSON(e, setSerialConfig)} />
                            </label>
                            <button onClick={() => downloadJSON(serialConfig, 'sophos-serial-config.json')}
                                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors flex items-center gap-2">
                                <IcoDownload className="w-4 h-4" />Export Serials
                            </button>
                            <button onClick={() => setSerialExpanded(x => !x)}
                                className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors">
                                {serialExpanded ? 'Collapse' : 'Expand'}
                            </button>
                        </div>
                    </div>

                    {serialExpanded && (
                        <div className="space-y-4">
                            <div className="grid grid-cols-4 gap-3 p-4 bg-slate-800/50 rounded-lg">
                                <input type="text" placeholder="Serial Number" value={newSerial.serialNumber}
                                    onChange={e => setNewSerial(p => ({ ...p, serialNumber: e.target.value }))}
                                    className="px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm mono focus:outline-none focus:ring-2 focus:ring-sky-400" />
                                <input type="text" placeholder="Expected Client" value={newSerial.expectedClient}
                                    onChange={e => setNewSerial(p => ({ ...p, expectedClient: e.target.value }))}
                                    className="px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                                <input type="text" placeholder="Description (optional)" value={newSerial.description}
                                    onChange={e => setNewSerial(p => ({ ...p, description: e.target.value }))}
                                    className="px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                                <button onClick={() => {
                                    if (newSerial.serialNumber && newSerial.expectedClient) {
                                        setSerialConfig(p => [...p, { ...newSerial }]);
                                        setNewSerial({ serialNumber: '', expectedClient: '', description: '' });
                                    }
                                }} className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded font-medium transition-colors">
                                    Add
                                </button>
                            </div>

                            <div className="space-y-2 max-h-64 overflow-y-auto">
                                {serialConfig.map((cfg, i) => (
                                    <div key={i} className="grid grid-cols-4 gap-3 p-3 bg-slate-800/30 rounded-lg items-center text-sm">
                                        <span className="text-sky-300 mono font-medium">{cfg.serialNumber}</span>
                                        <span className="text-white">{cfg.expectedClient}</span>
                                        <span className="text-slate-300">{cfg.description || '—'}</span>
                                        <button onClick={() => setSerialConfig(p => p.filter((_, j) => j !== i))}
                                            className="px-3 py-1 bg-red-600/20 hover:bg-red-600/40 text-red-300 rounded transition-colors text-xs">
                                            Remove
                                        </button>
                                    </div>
                                ))}
                            </div>

                            {invoiceData.length > 0 && serialValidation.length > 0 && (
                                <div className="mt-4">
                                    <h3 className="text-lg font-semibold text-white mb-3">Validation Results</h3>
                                    <div className="flex gap-3 mb-4 flex-wrap">
                                        {[
                                            ['correct', 'bg-emerald-900/30 border-emerald-500/50', 'text-emerald-300', '✓ Correct'],
                                            ['mismatch','bg-red-900/30 border-red-500/50',         'text-red-300',     '⚠ Mismatched'],
                                            ['missing', 'bg-orange-900/30 border-orange-500/50',    'text-orange-300',  '? Missing'],
                                        ].map(([status, bg, txt, label]) => (
                                            <div key={status} className={`px-4 py-2 ${bg} border rounded-lg`}>
                                                <span className={`${txt} font-semibold`}>
                                                    {serialValidation.filter(s => s.status === status).length} {label}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm">
                                            <thead className="bg-slate-800/50">
                                                <tr>
                                                    {['Status','Serial Number','Expected Client','Actual Client','SKU','Description'].map(h => (
                                                        <th key={h} className="px-3 py-3 text-left text-sky-200 font-semibold">{h}</th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {serialValidation.map((item, i) => (
                                                    <tr key={i} className={`border-b border-slate-700/50 transition-colors ${
                                                        item.status === 'mismatch' ? 'bg-red-900/20' :
                                                        item.status === 'missing'  ? 'bg-orange-900/20' : 'hover:bg-slate-800/30'}`}>
                                                        <td className="px-3 py-3">
                                                            {item.status === 'correct'  && <span className="text-emerald-400 font-semibold">✓ Correct</span>}
                                                            {item.status === 'mismatch' && <span className="text-red-400 font-semibold">⚠ MISMATCH</span>}
                                                            {item.status === 'missing'  && <span className="text-orange-400 font-semibold">? Missing</span>}
                                                        </td>
                                                        <td className="px-3 py-3 text-sky-300 mono font-medium">{item.serialNumber}</td>
                                                        <td className="px-3 py-3 text-white">{item.expectedClient}</td>
                                                        <td className={`px-3 py-3 ${item.status === 'mismatch' ? 'text-red-300 font-semibold' : 'text-slate-300'}`}>{item.actualClient || '—'}</td>
                                                        <td className="px-3 py-3 text-slate-300 text-xs">{item.sku || '—'}</td>
                                                        <td className="px-3 py-3 text-slate-400 text-xs">{item.description || '—'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-4 p-3 bg-blue-900/20 border border-blue-500/30 rounded-lg text-blue-200 text-xs">
                                        <strong>Tip:</strong> Red rows indicate vendor errors — the serial is assigned to the wrong tenant. Send back to vendor for correction.
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>

                {/* ── Analysis Table ── */}
                {(invoiceData.length > 0 || histCount > 0) && clientSkuConfig.length > 0 && (
                    <div className="glass rounded-2xl p-6 fade-in" style={{ animationDelay: '0.3s' }}>
                        <div className="flex justify-between items-center mb-6 flex-wrap gap-4">
                            <h2 className="text-2xl font-semibold text-white">Usage Analysis — Rolling 12 Months</h2>
                            <input type="text" placeholder="Filter by client, SKU, or description…"
                                value={clientFilter} onChange={e => setClientFilter(e.target.value)}
                                className="px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white w-80 focus:outline-none focus:ring-2 focus:ring-sky-400" />
                        </div>

                        {/* Summary cards */}
                        <div className="grid grid-cols-3 gap-4 mb-6">
                            {[
                                ['Revenue Adjustment', totals.rev.toFixed(2),    'emerald'],
                                ['Total Cost',         totals.cost.toFixed(2),   'purple'],
                                ['Total Margin',       totals.margin.toFixed(2), 'sky'],
                            ].map(([label, val, color]) => (
                                <div key={label} className={`p-4 bg-gradient-to-br from-${color}-900/40 to-${color}-800/20 border border-${color}-500/30 rounded-lg`}>
                                    <p className={`text-sm text-${color}-200 mb-1`}>{label}</p>
                                    <p className={`text-3xl font-bold text-${color}-300 mono`}>${val}</p>
                                </div>
                            ))}
                        </div>

                        {filteredData.length === 0 ? (
                            <div className="text-center py-12 text-slate-400 text-lg">
                                {clientFilter ? `No results for "${clientFilter}"` : 'No tracked items to display'}
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead className="bg-slate-800/50">
                                        <tr>
                                            <th className="px-3 py-3 text-left text-sky-200 font-semibold sticky left-0 bg-slate-800/90 z-10">Client</th>
                                            <th className="px-3 py-3 text-left text-sky-200 font-semibold">Description</th>
                                            <th className="px-3 py-3 text-center text-sky-200 font-semibold" title="12-month quantity trend + current month">Trend</th>
                                            {rolling12.map(({ label }) => (
                                                <th key={label} className="px-3 py-3 text-right text-sky-200 font-semibold mono text-xs">{fmtMonth(label)}</th>
                                            ))}
                                            <th className="px-3 py-3 text-right text-emerald-300 font-semibold">Current</th>
                                            <th className="px-3 py-3 text-right text-sky-200 font-semibold">Expected</th>
                                            <th className="px-3 py-3 text-right text-sky-200 font-semibold">Variance</th>
                                            <th className="px-3 py-3 text-right text-sky-200 font-semibold">QB Adj</th>
                                            <th className="px-3 py-3 text-right text-purple-200 font-semibold">Cost</th>
                                            <th className="px-3 py-3 text-right text-emerald-200 font-semibold">Margin</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredData.map((row, i) => (
                                            <tr key={i} className="border-b border-slate-700/50 hover:bg-slate-800/30 transition-colors">
                                                <td className="px-3 py-3 font-medium text-white sticky left-0 bg-slate-900/90">{row.clientName}</td>
                                                <td className="px-3 py-3 text-slate-300" title={`SKU: ${row.sku}`}>{row.description || row.sku}</td>
                                                <td className="px-3 py-2 text-center">
                                                    <Sparkline
                                                        monthlyQty={row.monthlyQty}
                                                        months={rolling12}
                                                        currentQty={invoiceData.length > 0 ? row.actualQty : undefined}
                                                        w={90} h={28}
                                                    />
                                                </td>
                                                {rolling12.map(({ label }) => (
                                                    <td key={label} className="px-3 py-3 text-right text-slate-400 mono">
                                                        {row.monthlyQty[label] > 0 ? row.monthlyQty[label] : '—'}
                                                    </td>
                                                ))}
                                                <td className="px-3 py-3 text-right font-bold text-emerald-300 mono">{row.actualQty}</td>
                                                <td className="px-3 py-3 text-right text-slate-300 mono">{row.expectedQty || '—'}</td>
                                                <td className="px-3 py-3 text-right mono">
                                                    <span className={`flex items-center justify-end gap-1 ${
                                                        row.variance > 0 ? 'text-orange-400' :
                                                        row.variance < 0 ? 'text-sky-400' : 'text-slate-500'}`}>
                                                        {row.variance > 0 && <IcoUp className="w-3 h-3" />}
                                                        {row.variance < 0 && <IcoDown className="w-3 h-3" />}
                                                        {row.variance}
                                                    </span>
                                                </td>
                                                <td className="px-3 py-3 text-right mono">
                                                    <span className={`font-bold ${
                                                        row.revenueAdj > 0 ? 'text-emerald-400' :
                                                        row.revenueAdj < 0 ? 'text-red-400' : 'text-slate-500'}`}>
                                                        {row.revenueAdj >= 0 ? '+' : ''}${row.revenueAdj.toFixed(2)}
                                                    </span>
                                                </td>
                                                <td className="px-3 py-3 text-right text-purple-300 mono">${row.actualCost.toFixed(2)}</td>
                                                <td className="px-3 py-3 text-right text-emerald-400 mono font-medium">${row.margin.toFixed(2)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* Legend */}
                        <div className="mt-6 p-4 bg-slate-800/50 rounded-lg border border-slate-700">
                            <p className="font-semibold text-sky-200 mb-2">Column Guide</p>
                            <ul className="space-y-1 text-xs text-slate-300">
                                <li><strong className="text-sky-300">Trend:</strong> SVG sparkline of 12-month history + current upload — green = up, red = down, gray = flat</li>
                                <li><strong className="text-sky-300">Rolling 12 Months:</strong> Saved quantities per month (from bulk or single saves)</li>
                                <li><strong className="text-emerald-300">Current:</strong> Qty from uploaded invoice | <strong className="text-sky-300">Expected:</strong> Planned billing qty</li>
                                <li><strong className="text-sky-300">Variance:</strong> Current − Expected | <strong className="text-sky-300">QB Adj:</strong> Variance × Billing Rate</li>
                                <li><strong className="text-purple-300">Cost:</strong> Vendor cost | <strong className="text-emerald-300">Margin:</strong> (Current × Rate) − Cost</li>
                                <li className="mt-2 pt-2 border-t border-slate-700 italic">Month label format: Sophos-MMYY — e.g. Sophos-0126 = Jan 2026</li>
                            </ul>
                        </div>
                    </div>
                )}

            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<SophosUsageTracker />);
</script>
</body>
</html>
