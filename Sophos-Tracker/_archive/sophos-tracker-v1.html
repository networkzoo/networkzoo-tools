<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Usage Tracker & QuickBooks Adjustment Calculator</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Upload = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
        );

        const Download = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const Save = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
        );

        const AlertCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const TrendingUp = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const TrendingDown = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
        );

        const Minus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" />
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        const SophosUsageTracker = () => {
            const [invoiceData, setInvoiceData] = useState([]);
            const [clientConfig, setClientConfig] = useState([
                { clientName: 'Example Client A', trackUsage: true, expectedQty: 10, billingRate: 15.00, sku: 'SOPHOS-SKU-1' },
                { clientName: 'Example Client B', trackUsage: false, expectedQty: 0, billingRate: 0, sku: '' },
            ]);
            
            const [newClient, setNewClient] = useState({
                clientName: '', trackUsage: true, expectedQty: 0, billingRate: 0, sku: ''
            });

            const [uploadError, setUploadError] = useState('');
            const [currentMonthLabel, setCurrentMonthLabel] = useState('');
            const [historicalData, setHistoricalData] = useState({});

            // Load historical data from localStorage on mount
            useEffect(() => {
                const saved = localStorage.getItem('sophosHistoricalData');
                if (saved) {
                    try {
                        setHistoricalData(JSON.parse(saved));
                    } catch (e) {
                        console.error('Error loading historical data:', e);
                    }
                }

                const savedConfig = localStorage.getItem('sophosClientConfig');
                if (savedConfig) {
                    try {
                        setClientConfig(JSON.parse(savedConfig));
                    } catch (e) {
                        console.error('Error loading client config:', e);
                    }
                }
            }, []);

            // Auto-save client config
            useEffect(() => {
                localStorage.setItem('sophosClientConfig', JSON.stringify(clientConfig));
            }, [clientConfig]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploadError('');
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const text = event.target.result;
                            const lines = text.split('\n').filter(line => line.trim());
                            
                            if (lines.length < 2) {
                                setUploadError('File appears empty or has no data rows');
                                return;
                            }
                            
                            let delimiter = '\t';
                            if (!lines[0].includes('\t') && lines[0].includes(',')) {
                                delimiter = ',';
                            }
                            
                            const headers = lines[0].split(delimiter).map(h => h.trim().replace(/"/g, ''));
                            
                            const parsed = lines.slice(1).map(line => {
                                const values = line.split(delimiter).map(v => v.trim().replace(/"/g, ''));
                                const row = {};
                                headers.forEach((header, i) => {
                                    row[header] = values[i] || '';
                                });
                                return row;
                            }).filter(row => row['End User Name'] && row['End User Name'].length > 0);
                            
                            if (parsed.length === 0) {
                                setUploadError(`Found headers but no valid data rows. Headers found: ${headers.join(', ')}`);
                                return;
                            }
                            
                            setInvoiceData(parsed);
                            setUploadError('');
                        } catch (err) {
                            setUploadError(`Error parsing file: ${err.message}`);
                        }
                    };
                    reader.onerror = () => {
                        setUploadError('Error reading file');
                    };
                    reader.readAsText(file);
                }
            };

            const addClient = () => {
                if (newClient.clientName) {
                    setClientConfig([...clientConfig, { ...newClient }]);
                    setNewClient({ clientName: '', trackUsage: true, expectedQty: 0, billingRate: 0, sku: '' });
                }
            };

            const importClientsFromInvoice = () => {
                const clientNames = invoiceData.map(row => {
                    const endUserName = row['End User Name'];
                    const serialNumber = row['Serial Number'];
                    
                    if (!endUserName || endUserName.trim() === '***' || endUserName.trim() === '') {
                        return serialNumber ? `SN: ${serialNumber}` : null;
                    }
                    return endUserName;
                }).filter(Boolean);
                
                const uniqueClients = [...new Set(clientNames)];
                
                const newClients = uniqueClients
                    .filter(clientName => !clientConfig.some(c => c.clientName === clientName))
                    .map(clientName => {
                        const clientInvoice = invoiceData.find(inv => {
                            if (clientName.startsWith('SN: ')) {
                                const serial = clientName.replace('SN: ', '');
                                return inv['Serial Number'] === serial;
                            }
                            return inv['End User Name'] === clientName;
                        });
                        
                        let defaultRate = 0;
                        if (clientInvoice) {
                            const unitPrice = parseFloat(clientInvoice['Unit Price']) || 0;
                            defaultRate = Math.round(unitPrice * 1.4 * 100) / 100;
                        }
                        
                        return {
                            clientName,
                            trackUsage: true,
                            expectedQty: 0,
                            billingRate: defaultRate,
                            sku: ''
                        };
                    });
                
                if (newClients.length > 0) {
                    setClientConfig([...clientConfig, ...newClients]);
                }
            };

            const saveCurrentMonth = () => {
                if (!currentMonthLabel.trim()) {
                    alert('Please enter a month label (e.g., "Jan 2025" or "2025-01")');
                    return;
                }

                const monthData = {
                    label: currentMonthLabel,
                    timestamp: new Date().toISOString(),
                    data: comparisonData.map(row => ({
                        clientName: row.clientName,
                        actualQty: row.actualQty,
                        actualCost: row.actualCost,
                        suggestedRevenue: row.suggestedRevenue
                    }))
                };

                const updated = { ...historicalData, [currentMonthLabel]: monthData };
                setHistoricalData(updated);
                localStorage.setItem('sophosHistoricalData', JSON.stringify(updated));
                alert(`Saved data for ${currentMonthLabel}!`);
            };

            const clearHistoricalData = () => {
                if (confirm('Are you sure you want to clear all historical data? This cannot be undone.')) {
                    setHistoricalData({});
                    localStorage.removeItem('sophosHistoricalData');
                }
            };

            const removeClient = (index) => {
                setClientConfig(clientConfig.filter((_, i) => i !== index));
            };

            const updateClient = (index, field, value) => {
                const updated = [...clientConfig];
                updated[index][field] = value;
                setClientConfig(updated);
            };

            const comparisonData = useMemo(() => {
                return clientConfig
                    .filter(client => client.trackUsage)
                    .map(client => {
                        const clientInvoices = invoiceData.filter(inv => {
                            const endUserName = inv['End User Name'];
                            const serialNumber = inv['Serial Number'];
                            
                            if (client.clientName.startsWith('SN: ')) {
                                const clientSerial = client.clientName.replace('SN: ', '');
                                return serialNumber === clientSerial;
                            }
                            
                            const matchesName = endUserName?.toLowerCase().includes(client.clientName.toLowerCase());
                            const matchesSku = !client.sku || inv['Sku'] === client.sku;
                            
                            return matchesName && matchesSku;
                        });
                        
                        const actualQty = clientInvoices.reduce((sum, inv) => {
                            return sum + (parseInt(inv['Qty']) || 0);
                        }, 0);
                        
                        const actualCost = clientInvoices.reduce((sum, inv) => {
                            return sum + (parseFloat(inv['Ext Price']) || 0);
                        }, 0);
                        
                        const variance = actualQty - client.expectedQty;
                        
                        let expectedRevenue, suggestedRevenue;
                        if (client.billingRate > 0) {
                            expectedRevenue = client.expectedQty * client.billingRate;
                            suggestedRevenue = actualQty * client.billingRate;
                        } else {
                            expectedRevenue = actualCost * 1.4;
                            suggestedRevenue = actualCost * 1.4;
                        }
                        
                        const revenueAdjustment = suggestedRevenue - expectedRevenue;
                        
                        return {
                            clientName: client.clientName,
                            sku: client.sku,
                            expectedQty: client.expectedQty,
                            actualQty,
                            variance,
                            billingRate: client.billingRate,
                            expectedRevenue,
                            suggestedRevenue,
                            revenueAdjustment,
                            actualCost,
                            margin: suggestedRevenue - actualCost,
                            invoiceCount: clientInvoices.length
                        };
                    });
            }, [clientConfig, invoiceData]);

            // Calculate trends by comparing to last saved month
            const comparisonWithTrends = useMemo(() => {
                const months = Object.keys(historicalData).sort();
                if (months.length === 0) {
                    return comparisonData.map(row => ({ ...row, trend: null, trendQty: 0, trendPct: 0 }));
                }

                const lastMonth = historicalData[months[months.length - 1]];
                
                return comparisonData.map(row => {
                    const lastMonthData = lastMonth.data.find(d => d.clientName === row.clientName);
                    
                    if (!lastMonthData) {
                        return { ...row, trend: 'new', trendQty: 0, trendPct: 0 };
                    }

                    const qtyChange = row.actualQty - lastMonthData.actualQty;
                    const pctChange = lastMonthData.actualQty > 0 
                        ? ((qtyChange / lastMonthData.actualQty) * 100)
                        : 0;

                    let trend = 'stable';
                    if (qtyChange > 0) trend = 'up';
                    else if (qtyChange < 0) trend = 'down';

                    return {
                        ...row,
                        trend,
                        trendQty: qtyChange,
                        trendPct: pctChange,
                        lastMonthQty: lastMonthData.actualQty
                    };
                });
            }, [comparisonData, historicalData]);

            const downloadCSV = (data, filename) => {
                const headers = Object.keys(data[0] || {});
                const csv = [
                    headers.join(','),
                    ...data.map(row => headers.map(h => `"${row[h] ?? ''}"`).join(','))
                ].join('\n');
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
            };

            const totals = useMemo(() => {
                return comparisonData.reduce((acc, row) => ({
                    totalAdjustment: acc.totalAdjustment + row.revenueAdjustment,
                    totalMargin: acc.totalMargin + row.margin,
                    totalCost: acc.totalCost + row.actualCost,
                    totalRevenue: acc.totalRevenue + row.suggestedRevenue
                }), { totalAdjustment: 0, totalMargin: 0, totalCost: 0, totalRevenue: 0 });
            }, [comparisonData]);

            const savedMonths = Object.keys(historicalData).sort();

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">Sophos Usage Tracker</h1>
                            <p className="text-gray-600">Import Climb invoices, configure client billing, and generate QuickBooks adjustment reports with month-to-month trend tracking</p>
                            
                            {savedMonths.length > 0 && (
                                <div className="mt-4 p-3 bg-blue-50 rounded-lg">
                                    <p className="text-sm text-blue-900">
                                        <strong>Historical Data:</strong> {savedMonths.length} month(s) saved — {savedMonths.join(', ')}
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* File Upload */}
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                <Upload className="w-5 h-5" />
                                Step 1: Import Climb Invoice Data
                            </h2>
                            <div className="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                                <input
                                    type="file"
                                    accept=".csv,.txt,.tsv"
                                    onChange={handleFileUpload}
                                    className="hidden"
                                    id="file-upload"
                                />
                                <label htmlFor="file-upload" className="cursor-pointer">
                                    <Upload className="w-12 h-12 mx-auto text-gray-400 mb-4" />
                                    <p className="text-sm text-gray-600">Click to upload or drag and drop</p>
                                    <p className="text-xs text-gray-500 mt-1">CSV, TXT, or TSV (tab-separated)</p>
                                </label>
                            </div>
                            {uploadError && (
                                <div className="mt-4 p-4 bg-red-50 rounded-lg">
                                    <p className="text-sm text-red-800">⚠ {uploadError}</p>
                                </div>
                            )}
                            {invoiceData.length > 0 && (
                                <div className="mt-4 p-4 bg-green-50 rounded-lg">
                                    <p className="text-sm text-green-800">✓ Loaded {invoiceData.length} invoice line items</p>
                                    <p className="text-xs text-green-700 mt-1">
                                        Sample: {invoiceData[0]['End User Name']} - {invoiceData[0]['Description']} (Qty: {invoiceData[0]['Qty']})
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Client Configuration */}
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-semibold">Step 2: Configure Clients</h2>
                                {invoiceData.length > 0 && (
                                    <button
                                        onClick={importClientsFromInvoice}
                                        className="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 text-sm"
                                    >
                                        Import Clients from Invoice
                                    </button>
                                )}
                            </div>
                            
                            {/* Add New Client */}
                            <div className="mb-6 p-4 bg-gray-50 rounded-lg">
                                <h3 className="text-sm font-medium mb-3">Add New Client</h3>
                                <div className="grid grid-cols-1 md:grid-cols-6 gap-3">
                                    <input
                                        type="text"
                                        placeholder="Client Name"
                                        value={newClient.clientName}
                                        onChange={(e) => setNewClient({...newClient, clientName: e.target.value})}
                                        className="px-3 py-2 border rounded-md"
                                    />
                                    <input
                                        type="text"
                                        placeholder="SKU (optional)"
                                        value={newClient.sku}
                                        onChange={(e) => setNewClient({...newClient, sku: e.target.value})}
                                        className="px-3 py-2 border rounded-md"
                                    />
                                    <input
                                        type="number"
                                        placeholder="Expected Qty"
                                        value={newClient.expectedQty}
                                        onChange={(e) => setNewClient({...newClient, expectedQty: parseFloat(e.target.value) || 0})}
                                        className="px-3 py-2 border rounded-md"
                                    />
                                    <input
                                        type="number"
                                        step="0.01"
                                        placeholder="Billing Rate (auto: cost + 40%)"
                                        value={newClient.billingRate}
                                        onChange={(e) => setNewClient({...newClient, billingRate: parseFloat(e.target.value) || 0})}
                                        className="px-3 py-2 border rounded-md"
                                    />
                                    <label className="flex items-center gap-2 px-3 py-2">
                                        <input
                                            type="checkbox"
                                            checked={newClient.trackUsage}
                                            onChange={(e) => setNewClient({...newClient, trackUsage: e.target.checked})}
                                            className="rounded"
                                        />
                                        <span className="text-sm">Track Usage</span>
                                    </label>
                                    <button
                                        onClick={addClient}
                                        className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
                                    >
                                        Add
                                    </button>
                                </div>
                            </div>

                            {/* Client List */}
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead className="bg-gray-100">
                                        <tr>
                                            <th className="px-4 py-2 text-left">Client Name</th>
                                            <th className="px-4 py-2 text-left">SKU Filter</th>
                                            <th className="px-4 py-2 text-right">Expected Qty</th>
                                            <th className="px-4 py-2 text-right">Billing Rate (cost + 40% default)</th>
                                            <th className="px-4 py-2 text-center">Track Usage</th>
                                            <th className="px-4 py-2"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {clientConfig.map((client, idx) => (
                                            <tr key={idx} className="border-b">
                                                <td className="px-4 py-2">
                                                    <input
                                                        type="text"
                                                        value={client.clientName}
                                                        onChange={(e) => updateClient(idx, 'clientName', e.target.value)}
                                                        className="w-full px-2 py-1 border rounded"
                                                    />
                                                </td>
                                                <td className="px-4 py-2">
                                                    <input
                                                        type="text"
                                                        value={client.sku}
                                                        onChange={(e) => updateClient(idx, 'sku', e.target.value)}
                                                        className="w-full px-2 py-1 border rounded"
                                                        placeholder="All SKUs"
                                                    />
                                                </td>
                                                <td className="px-4 py-2">
                                                    <input
                                                        type="number"
                                                        value={client.expectedQty}
                                                        onChange={(e) => updateClient(idx, 'expectedQty', parseFloat(e.target.value) || 0)}
                                                        className="w-full px-2 py-1 border rounded text-right"
                                                    />
                                                </td>
                                                <td className="px-4 py-2">
                                                    <input
                                                        type="number"
                                                        step="0.01"
                                                        value={client.billingRate}
                                                        onChange={(e) => updateClient(idx, 'billingRate', parseFloat(e.target.value) || 0)}
                                                        className="w-full px-2 py-1 border rounded text-right"
                                                    />
                                                </td>
                                                <td className="px-4 py-2 text-center">
                                                    <input
                                                        type="checkbox"
                                                        checked={client.trackUsage}
                                                        onChange={(e) => updateClient(idx, 'trackUsage', e.target.checked)}
                                                        className="rounded"
                                                    />
                                                </td>
                                                <td className="px-4 py-2">
                                                    <button
                                                        onClick={() => removeClient(idx)}
                                                        className="text-red-600 hover:text-red-800"
                                                    >
                                                        Remove
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Save Month Section */}
                        {comparisonData.length > 0 && (
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                    <Calendar className="w-5 h-5" />
                                    Step 3: Save This Month's Data
                                </h2>
                                <div className="flex items-center gap-4">
                                    <input
                                        type="text"
                                        placeholder="e.g., Jan 2025 or 2025-01"
                                        value={currentMonthLabel}
                                        onChange={(e) => setCurrentMonthLabel(e.target.value)}
                                        className="flex-1 px-4 py-2 border rounded-md"
                                    />
                                    <button
                                        onClick={saveCurrentMonth}
                                        className="flex items-center gap-2 px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
                                    >
                                        <Save className="w-4 h-4" />
                                        Save Month
                                    </button>
                                    {savedMonths.length > 0 && (
                                        <button
                                            onClick={clearHistoricalData}
                                            className="px-4 py-2 bg-red-100 text-red-700 rounded-md hover:bg-red-200 text-sm"
                                        >
                                            Clear History
                                        </button>
                                    )}
                                </div>
                                <p className="mt-2 text-xs text-gray-500">
                                    Save this month's data to enable month-to-month trend comparison. Data is stored locally in your browser.
                                </p>
                            </div>
                        )}

                        {/* Comparison Report */}
                        {comparisonWithTrends.length > 0 && (
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-semibold">Step 4: Usage Comparison & QB Adjustments</h2>
                                    <button
                                        onClick={() => downloadCSV(comparisonWithTrends, 'sophos-qb-adjustments.csv')}
                                        className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700"
                                    >
                                        <Download className="w-4 h-4" />
                                        Export to CSV
                                    </button>
                                </div>

                                {/* Summary Cards */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                    <div className="p-4 bg-blue-50 rounded-lg">
                                        <p className="text-sm text-gray-600">Total Adjustment Needed</p>
                                        <p className={`text-2xl font-bold ${totals.totalAdjustment >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            ${totals.totalAdjustment.toFixed(2)}
                                        </p>
                                    </div>
                                    <div className="p-4 bg-green-50 rounded-lg">
                                        <p className="text-sm text-gray-600">Total Suggested Revenue</p>
                                        <p className="text-2xl font-bold text-gray-900">${totals.totalRevenue.toFixed(2)}</p>
                                    </div>
                                    <div className="p-4 bg-purple-50 rounded-lg">
                                        <p className="text-sm text-gray-600">Total Cost</p>
                                        <p className="text-2xl font-bold text-gray-900">${totals.totalCost.toFixed(2)}</p>
                                    </div>
                                    <div className="p-4 bg-yellow-50 rounded-lg">
                                        <p className="text-sm text-gray-600">Total Margin</p>
                                        <p className="text-2xl font-bold text-gray-900">${totals.totalMargin.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-gray-100">
                                            <tr>
                                                <th className="px-4 py-2 text-left">Client</th>
                                                <th className="px-4 py-2 text-right">Expected</th>
                                                <th className="px-4 py-2 text-right">Actual</th>
                                                <th className="px-4 py-2 text-right">Variance</th>
                                                {savedMonths.length > 0 && (
                                                    <th className="px-4 py-2 text-right">MoM Trend</th>
                                                )}
                                                <th className="px-4 py-2 text-right">Expected Revenue</th>
                                                <th className="px-4 py-2 text-right">Suggested Revenue</th>
                                                <th className="px-4 py-2 text-right">QB Adjustment</th>
                                                <th className="px-4 py-2 text-right">Cost</th>
                                                <th className="px-4 py-2 text-right">Margin</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {comparisonWithTrends.map((row, idx) => (
                                                <tr key={idx} className="border-b hover:bg-gray-50">
                                                    <td className="px-4 py-2 font-medium">{row.clientName}</td>
                                                    <td className="px-4 py-2 text-right">{row.expectedQty}</td>
                                                    <td className="px-4 py-2 text-right font-medium">{row.actualQty}</td>
                                                    <td className="px-4 py-2 text-right">
                                                        <span className={`flex items-center justify-end gap-1 ${
                                                            row.variance > 0 ? 'text-red-600' : row.variance < 0 ? 'text-green-600' : 'text-gray-600'
                                                        }`}>
                                                            {row.variance > 0 && <TrendingUp className="w-4 h-4" />}
                                                            {row.variance < 0 && <TrendingDown className="w-4 h-4" />}
                                                            {row.variance === 0 && <Minus className="w-4 h-4" />}
                                                            {row.variance}
                                                        </span>
                                                    </td>
                                                    {savedMonths.length > 0 && (
                                                        <td className="px-4 py-2 text-right">
                                                            {row.trend === 'new' ? (
                                                                <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">NEW</span>
                                                            ) : row.trend === 'up' ? (
                                                                <span className="flex items-center justify-end gap-1 text-orange-600 font-medium">
                                                                    <TrendingUp className="w-4 h-4" />
                                                                    +{row.trendQty} ({row.trendPct.toFixed(0)}%)
                                                                </span>
                                                            ) : row.trend === 'down' ? (
                                                                <span className="flex items-center justify-end gap-1 text-blue-600 font-medium">
                                                                    <TrendingDown className="w-4 h-4" />
                                                                    {row.trendQty} ({row.trendPct.toFixed(0)}%)
                                                                </span>
                                                            ) : (
                                                                <span className="flex items-center justify-end gap-1 text-gray-500">
                                                                    <Minus className="w-4 h-4" />
                                                                    No change
                                                                </span>
                                                            )}
                                                        </td>
                                                    )}
                                                    <td className="px-4 py-2 text-right">${row.expectedRevenue.toFixed(2)}</td>
                                                    <td className="px-4 py-2 text-right font-medium">${row.suggestedRevenue.toFixed(2)}</td>
                                                    <td className="px-4 py-2 text-right">
                                                        <span className={`font-bold ${
                                                            row.revenueAdjustment > 0 ? 'text-green-600' : row.revenueAdjustment < 0 ? 'text-red-600' : 'text-gray-600'
                                                        }`}>
                                                            {row.revenueAdjustment >= 0 ? '+' : ''}${row.revenueAdjustment.toFixed(2)}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-2 text-right">${row.actualCost.toFixed(2)}</td>
                                                    <td className="px-4 py-2 text-right text-green-600 font-medium">${row.margin.toFixed(2)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                                    <div className="flex gap-2">
                                        <AlertCircle className="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5" />
                                        <div className="text-sm text-blue-900">
                                            <p className="font-medium mb-1">Understanding the Trend Column:</p>
                                            <ul className="list-disc list-inside space-y-1 mb-3">
                                                <li><strong>Orange Up Arrow:</strong> Usage increased vs. last saved month</li>
                                                <li><strong>Blue Down Arrow:</strong> Usage decreased vs. last saved month</li>
                                                <li><strong>Gray Dash:</strong> Usage unchanged from last month</li>
                                                <li><strong>NEW badge:</strong> Client wasn't in last month's data</li>
                                            </ul>
                                            <p className="font-medium mb-1">Next Steps for QuickBooks:</p>
                                            <ol className="list-decimal list-inside space-y-1">
                                                <li>Export this data to CSV using the button above</li>
                                                <li>For clients with positive adjustments (green), add a line item or create a supplemental invoice</li>
                                                <li>For clients with negative adjustments (red), issue a credit memo or reduce next month's invoice</li>
                                                <li>Watch the MoM trends to identify clients with growing/shrinking needs</li>
                                            </ol>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SophosUsageTracker />);
    </script>
</body>
</html>
