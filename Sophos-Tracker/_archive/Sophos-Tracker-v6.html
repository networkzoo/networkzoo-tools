<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Usage Tracker - Rolling 12 Months</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }
        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: slideIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // IndexedDB utility functions
        const DB_NAME = 'SophosTrackerDB';
        const DB_VERSION = 1;
        const STORE_HISTORICAL = 'historicalData';
        const STORE_CONFIG = 'configurations';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    
                    if (!db.objectStoreNames.contains(STORE_HISTORICAL)) {
                        db.createObjectStore(STORE_HISTORICAL, { keyPath: 'monthLabel' });
                    }
                    
                    if (!db.objectStoreNames.contains(STORE_CONFIG)) {
                        db.createObjectStore(STORE_CONFIG, { keyPath: 'id' });
                    }
                };
            });
        };

        const saveToIndexedDB = async (storeName, data) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(data);
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const getFromIndexedDB = async (storeName, key) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.get(key);
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const getAllFromIndexedDB = async (storeName) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const deleteFromIndexedDB = async (storeName, key) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(key);
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        };

        // SVG Icons
        const Upload = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12' })
            )
        );

        const Download = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4' })
            )
        );

        const Calendar = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' })
            )
        );

        const TrendingUp = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' })
            )
        );

        const TrendingDown = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M13 17h8m0 0V9m0 8l-8-8-4 4-6-6' })
            )
        );

        const Minus = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M20 12H4' })
            )
        );

        // Utility functions
        const parseMonthLabel = (label) => {
            const match = label.match(/Sophos-(\d{2})(\d{2})/);
            if (!match) return null;
            const month = parseInt(match[1], 10);
            const year = 2000 + parseInt(match[2], 10);
            return new Date(year, month - 1);
        };

        const formatMonthLabel = (date) => {
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = String(date.getFullYear()).slice(-2);
            return `Sophos-${month}${year}`;
        };

        const formatMonthDisplay = (label) => {
            const date = parseMonthLabel(label);
            if (!date) return label;
            return date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        };

        const getLast12Months = (historicalData) => {
            const allMonths = Object.keys(historicalData)
                .map(label => ({ label, date: parseMonthLabel(label) }))
                .filter(item => item.date !== null)
                .sort((a, b) => b.date - a.date)
                .slice(0, 12)
                .reverse();
            return allMonths;
        };

        const SophosUsageTracker = () => {
            const [invoiceData, setInvoiceData] = useState([]);
            const [clientSkuConfig, setClientSkuConfig] = useState([]);
            const [newClientSku, setNewClientSku] = useState({
                clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0
            });
            const [uploadError, setUploadError] = useState('');
            const [currentMonthLabel, setCurrentMonthLabel] = useState('');
            const [historicalData, setHistoricalData] = useState({});
            const [configExpanded, setConfigExpanded] = useState(true);
            const [clientFilter, setClientFilter] = useState('');
            const [serialConfig, setSerialConfig] = useState([]);
            const [newSerial, setNewSerial] = useState({ serialNumber: '', expectedClient: '', description: '' });
            const [serialExpanded, setSerialExpanded] = useState(true);
            const [bulkUploadProgress, setBulkUploadProgress] = useState('');
            const [isMigrating, setIsMigrating] = useState(false);

            useEffect(() => {
                const loadData = async () => {
                    // Try to load from IndexedDB first
                    const allHistorical = await getAllFromIndexedDB(STORE_HISTORICAL);
                    if (allHistorical && allHistorical.length > 0) {
                        const historicalObj = {};
                        allHistorical.forEach(item => {
                            historicalObj[item.monthLabel] = item.data;
                        });
                        setHistoricalData(historicalObj);
                    } else {
                        // Fall back to localStorage and migrate
                        const saved = localStorage.getItem('sophosHistoricalData');
                        if (saved) {
                            try {
                                const data = JSON.parse(saved);
                                setHistoricalData(data);
                                
                                // Migrate to IndexedDB
                                setIsMigrating(true);
                                for (const [monthLabel, monthData] of Object.entries(data)) {
                                    await saveToIndexedDB(STORE_HISTORICAL, { monthLabel, data: monthData });
                                }
                                console.log('Migrated historical data to IndexedDB');
                                setIsMigrating(false);
                            } catch (e) {
                                console.error('Error loading historical data:', e);
                            }
                        }
                    }

                    // Load configs
                    const clientConfig = await getFromIndexedDB(STORE_CONFIG, 'clientSkuConfig');
                    if (clientConfig) {
                        setClientSkuConfig(clientConfig.data || []);
                    } else {
                        const savedConfig = localStorage.getItem('sophosClientSkuConfig');
                        if (savedConfig) {
                            try {
                                const config = JSON.parse(savedConfig);
                                setClientSkuConfig(config);
                                await saveToIndexedDB(STORE_CONFIG, { id: 'clientSkuConfig', data: config });
                            } catch (e) {
                                console.error('Error loading client config:', e);
                            }
                        }
                    }

                    const serialConfigData = await getFromIndexedDB(STORE_CONFIG, 'serialConfig');
                    if (serialConfigData) {
                        setSerialConfig(serialConfigData.data || []);
                    } else {
                        const savedSerialConfig = localStorage.getItem('sophosSerialConfig');
                        if (savedSerialConfig) {
                            try {
                                const config = JSON.parse(savedSerialConfig);
                                setSerialConfig(config);
                                await saveToIndexedDB(STORE_CONFIG, { id: 'serialConfig', data: config });
                            } catch (e) {
                                console.error('Error loading serial config:', e);
                            }
                        }
                    }
                };

                loadData();
            }, []);

            useEffect(() => {
                saveToIndexedDB(STORE_CONFIG, { id: 'clientSkuConfig', data: clientSkuConfig });
                // Keep localStorage as backup for now
                localStorage.setItem('sophosClientSkuConfig', JSON.stringify(clientSkuConfig));
            }, [clientSkuConfig]);

            useEffect(() => {
                saveToIndexedDB(STORE_CONFIG, { id: 'serialConfig', data: serialConfig });
                localStorage.setItem('sophosSerialConfig', JSON.stringify(serialConfig));
            }, [serialConfig]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploadError('');
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const text = event.target.result;
                            const rows = text.split('\n').map(r => r.trim()).filter(r => r);
                            
                            if (rows.length < 2) {
                                setUploadError('CSV must have at least a header row and one data row.');
                                return;
                            }

                            // Parse CSV with proper quote handling
                            const parseCSVRow = (row) => {
                                const result = [];
                                let current = '';
                                let inQuotes = false;
                                
                                for (let i = 0; i < row.length; i++) {
                                    const char = row[i];
                                    if (char === '"') {
                                        inQuotes = !inQuotes;
                                    } else if (char === ',' && !inQuotes) {
                                        result.push(current.trim());
                                        current = '';
                                    } else {
                                        current += char;
                                    }
                                }
                                result.push(current.trim());
                                return result;
                            };

                            const headers = parseCSVRow(rows[0]);
                            
                            // Try to find the right columns (case-insensitive, with fallbacks)
                            const findColumnIndex = (possibleNames) => {
                                for (const name of possibleNames) {
                                    const idx = headers.findIndex(h => h.toLowerCase() === name.toLowerCase());
                                    if (idx !== -1) return idx;
                                }
                                return -1;
                            };

                            const clientIdx = findColumnIndex(['End User Name', 'Client', 'Customer', 'End User']);
                            const skuIdx = findColumnIndex(['Sku', 'SKU', 'Product SKU']);
                            const qtyIdx = findColumnIndex(['Qty', 'Quantity']);
                            const costIdx = findColumnIndex(['Ext Price', 'Extended Price', 'Cost', 'Total', 'Total Price']);
                            const serialIdx = findColumnIndex(['Serial Number', 'Serial', 'License Serial']);

                            if (clientIdx === -1 || skuIdx === -1 || qtyIdx === -1 || costIdx === -1) {
                                setUploadError(`CSV missing required columns. Found: ${headers.join(', ')}`);
                                return;
                            }

                            const data = [];
                            for (let i = 1; i < rows.length; i++) {
                                const cols = parseCSVRow(rows[i]);
                                if (cols.length < 4) continue;
                                
                                const client = cols[clientIdx] || '';
                                const sku = cols[skuIdx] || '';
                                const qty = parseFloat(cols[qtyIdx]) || 0;
                                const cost = parseFloat(cols[costIdx]) || 0;
                                const serial = serialIdx !== -1 ? (cols[serialIdx] || '') : '';

                                if (client && sku) {
                                    data.push({ client, sku, qty, cost, serial });
                                }
                            }

                            setInvoiceData(data);
                        } catch (error) {
                            setUploadError('Error parsing CSV: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const handleBulkUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setBulkUploadProgress(`Processing ${files.length} files...`);
                let successCount = 0;
                let errorCount = 0;

                for (const file of files) {
                    try {
                        // Extract month from filename (e.g., sophos-0125.csv -> Sophos-0125)
                        const match = file.name.match(/sophos[-_]?(\d{4})/i);
                        if (!match) {
                            console.warn(`Skipping ${file.name} - filename must contain 'sophos-MMYY' (e.g., sophos-0125.csv)`);
                            errorCount++;
                            continue;
                        }

                        const monthCode = match[1];
                        const monthLabel = `Sophos-${monthCode}`;

                        // Read and parse the CSV
                        const text = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.onerror = reject;
                            reader.readAsText(file);
                        });

                        const rows = text.split('\n').map(r => r.trim()).filter(r => r);
                        if (rows.length < 2) {
                            errorCount++;
                            continue;
                        }

                        const parseCSVRow = (row) => {
                            const result = [];
                            let current = '';
                            let inQuotes = false;
                            
                            for (let i = 0; i < row.length; i++) {
                                const char = row[i];
                                if (char === '"') {
                                    inQuotes = !inQuotes;
                                } else if (char === ',' && !inQuotes) {
                                    result.push(current.trim());
                                    current = '';
                                } else {
                                    current += char;
                                }
                            }
                            result.push(current.trim());
                            return result;
                        };

                        const headers = parseCSVRow(rows[0]);
                        const findColumnIndex = (possibleNames) => {
                            for (const name of possibleNames) {
                                const idx = headers.findIndex(h => h.toLowerCase() === name.toLowerCase());
                                if (idx !== -1) return idx;
                            }
                            return -1;
                        };

                        const clientIdx = findColumnIndex(['End User Name', 'Client', 'Customer', 'End User']);
                        const skuIdx = findColumnIndex(['Sku', 'SKU', 'Product SKU']);
                        const qtyIdx = findColumnIndex(['Qty', 'Quantity']);

                        if (clientIdx === -1 || skuIdx === -1 || qtyIdx === -1) {
                            errorCount++;
                            continue;
                        }

                        const snapshot = {};
                        for (let i = 1; i < rows.length; i++) {
                            const cols = parseCSVRow(rows[i]);
                            if (cols.length < 4) continue;
                            
                            const client = cols[clientIdx] || '';
                            const sku = cols[skuIdx] || '';
                            const qty = parseFloat(cols[qtyIdx]) || 0;

                            if (client && sku) {
                                const key = `${client}|||${sku}`;
                                snapshot[key] = qty;
                            }
                        }

                        // Save to IndexedDB
                        await saveToIndexedDB(STORE_HISTORICAL, { monthLabel, data: snapshot });
                        successCount++;
                        setBulkUploadProgress(`Processed ${successCount}/${files.length} files...`);

                    } catch (error) {
                        console.error(`Error processing ${file.name}:`, error);
                        errorCount++;
                    }
                }

                // Reload historical data
                const allHistorical = await getAllFromIndexedDB(STORE_HISTORICAL);
                const historicalObj = {};
                allHistorical.forEach(item => {
                    historicalObj[item.monthLabel] = item.data;
                });
                setHistoricalData(historicalObj);

                setBulkUploadProgress(`✓ Complete: ${successCount} saved, ${errorCount} errors`);
                setTimeout(() => setBulkUploadProgress(''), 5000);
            };

            const handleAddClientSku = () => {
                if (newClientSku.clientName && newClientSku.sku) {
                    setClientSkuConfig([...clientSkuConfig, { ...newClientSku }]);
                    setNewClientSku({
                        clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0
                    });
                }
            };

            const handleRemoveClientSku = (index) => {
                setClientSkuConfig(clientSkuConfig.filter((_, i) => i !== index));
            };

            const handleAddSerial = () => {
                if (newSerial.serialNumber && newSerial.expectedClient) {
                    setSerialConfig([...serialConfig, { ...newSerial }]);
                    setNewSerial({ serialNumber: '', expectedClient: '', description: '' });
                }
            };

            const handleRemoveSerial = (index) => {
                setSerialConfig(serialConfig.filter((_, i) => i !== index));
            };

            const handleExportSerialConfig = () => {
                const dataStr = JSON.stringify(serialConfig, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sophos-serial-config.json';
                a.click();
            };

            const handleImportSerialConfig = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const config = JSON.parse(event.target.result);
                            setSerialConfig(config);
                        } catch (error) {
                            alert('Error parsing serial config file: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const handleAutoPopulateFromCSV = () => {
                if (invoiceData.length === 0) {
                    alert('Please upload a CSV file first');
                    return;
                }

                const newConfigs = [];
                const existingKeys = new Set(
                    clientSkuConfig.map(c => `${c.clientName}|||${c.sku}`)
                );

                invoiceData.forEach(item => {
                    const key = `${item.client}|||${item.sku}`;
                    if (!existingKeys.has(key)) {
                        newConfigs.push({
                            clientName: item.client,
                            sku: item.sku,
                            description: '',
                            trackUsage: true,
                            expectedQty: 0,
                            billingRate: 0
                        });
                        existingKeys.add(key);
                    }
                });

                if (newConfigs.length > 0) {
                    setClientSkuConfig([...clientSkuConfig, ...newConfigs]);
                    alert(`Added ${newConfigs.length} new client/SKU combinations. Please set billing rates for each.`);
                } else {
                    alert('All client/SKU combinations from the CSV are already configured.');
                }
            };

            const handleSaveMonth = async () => {
                if (!currentMonthLabel) {
                    alert('Please enter a month label (e.g., Sophos-0126)');
                    return;
                }

                const snapshot = {};
                invoiceData.forEach(item => {
                    const key = `${item.client}|||${item.sku}`;
                    snapshot[key] = item.qty;
                });

                // Save to IndexedDB
                await saveToIndexedDB(STORE_HISTORICAL, { monthLabel: currentMonthLabel, data: snapshot });
                
                // Update state
                const updated = { ...historicalData, [currentMonthLabel]: snapshot };
                setHistoricalData(updated);
                
                // Keep localStorage as backup
                localStorage.setItem('sophosHistoricalData', JSON.stringify(updated));
                
                alert(`Saved month: ${currentMonthLabel}`);
            };

            const handleExportConfig = () => {
                const dataStr = JSON.stringify(clientSkuConfig, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sophos-config.json';
                a.click();
            };

            const handleImportConfig = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const config = JSON.parse(event.target.result);
                            setClientSkuConfig(config);
                        } catch (error) {
                            alert('Error parsing config file: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const rolling12Months = useMemo(() => getLast12Months(historicalData), [historicalData]);

            const serialValidation = useMemo(() => {
                if (invoiceData.length === 0 || serialConfig.length === 0) return [];

                const results = [];
                serialConfig.forEach(config => {
                    const invoiceItems = invoiceData.filter(item => item.serial === config.serialNumber);
                    
                    if (invoiceItems.length === 0) {
                        // Serial not found in current invoice
                        results.push({
                            serialNumber: config.serialNumber,
                            expectedClient: config.expectedClient,
                            actualClient: null,
                            description: config.description,
                            status: 'missing',
                            sku: null,
                            qty: 0
                        });
                    } else {
                        // Check each occurrence of this serial
                        invoiceItems.forEach(item => {
                            const isCorrect = item.client === config.expectedClient;
                            results.push({
                                serialNumber: config.serialNumber,
                                expectedClient: config.expectedClient,
                                actualClient: item.client,
                                description: config.description,
                                status: isCorrect ? 'correct' : 'mismatch',
                                sku: item.sku,
                                qty: item.qty
                            });
                        });
                    }
                });

                return results;
            }, [invoiceData, serialConfig]);

            const analysisData = useMemo(() => {
                if (clientSkuConfig.length === 0) return [];

                const result = [];
                clientSkuConfig.forEach(config => {
                    if (!config.trackUsage) return;

                    const invoice = invoiceData.find(
                        i => i.client === config.clientName && i.sku === config.sku
                    );

                    const actualQty = invoice ? invoice.qty : 0;
                    const actualCost = invoice ? invoice.cost : 0;
                    const variance = actualQty - (config.expectedQty || 0);
                    const revenueAdjustment = variance * (config.billingRate || 0);
                    const margin = revenueAdjustment - actualCost;

                    // Get historical data for rolling 12 months
                    const monthlyQty = {};
                    rolling12Months.forEach(({ label }) => {
                        const snapshot = historicalData[label] || {};
                        const key = `${config.clientName}|||${config.sku}`;
                        monthlyQty[label] = snapshot[key] || 0;
                    });

                    // Get last month qty for trend
                    let lastMonthQty = undefined;
                    if (rolling12Months.length > 0) {
                        const lastMonth = rolling12Months[rolling12Months.length - 1].label;
                        const snapshot = historicalData[lastMonth] || {};
                        const key = `${config.clientName}|||${config.sku}`;
                        lastMonthQty = snapshot[key];
                    }

                    let trend = 'none';
                    let trendQty = 0;
                    if (lastMonthQty !== undefined && actualQty > 0) {
                        if (actualQty > lastMonthQty) {
                            trend = 'up';
                            trendQty = actualQty - lastMonthQty;
                        } else if (actualQty < lastMonthQty) {
                            trend = 'down';
                            trendQty = actualQty - lastMonthQty;
                        } else {
                            trend = 'stable';
                        }
                    } else if (actualQty > 0 && lastMonthQty === undefined) {

                                            React.createElement('th', { className: 'px-3 py-3 text-left text-sky-200 font-semibold sticky left-0 bg-slate-800/90 z-10' }, 'Client'),
                                            React.createElement('th', { className: 'px-3 py-3 text-left text-sky-200 font-semibold' }, 'Description'),
                                            rolling12Months.map(({ label }) => 
                                                React.createElement('th', { key: label, className: 'px-3 py-3 text-right text-sky-200 font-semibold mono text-xs' },
                                                    formatMonthDisplay(label)
                                                )
                                            ),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-emerald-300 font-semibold' }, 'Current'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'Expected'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'Variance'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'QB Adj'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'Margin')
                                        )
                                    ),
                                    React.createElement('tbody', null,
                                        filteredData.map((row, idx) => 
                                            React.createElement('tr', { key: idx, className: 'border-b border-slate-700/50 hover:bg-slate-800/30 transition-colors' },
                                                React.createElement('td', { className: 'px-3 py-3 font-medium text-white sticky left-0 bg-slate-900/90' }, row.clientName),
                                                React.createElement('td', { className: 'px-3 py-3 text-slate-300', title: `SKU: ${row.sku}` }, row.description || row.sku),
                                                rolling12Months.map(({ label }) => {
                                                    const qty = row.monthlyQty[label] || 0;
                                                    return React.createElement('td', { key: label, className: 'px-3 py-3 text-right text-slate-400 mono' },
                                                        qty > 0 ? qty : '-'
                                                    );
                                                }),
                                                React.createElement('td', { className: 'px-3 py-3 text-right font-bold text-emerald-300 mono' }, row.actualQty),
                                                React.createElement('td', { className: 'px-3 py-3 text-right text-slate-300 mono' }, row.expectedQty || '-'),
                                                React.createElement('td', { className: 'px-3 py-3 text-right mono' },
                                                    React.createElement('span', { 
                                                        className: `flex items-center justify-end gap-1 ${
                                                            row.variance > 0 ? 'text-orange-400' : row.variance < 0 ? 'text-sky-400' : 'text-slate-500'
                                                        }` 
                                                    },
                                                        row.variance > 0 && React.createElement(TrendingUp, { className: 'w-3 h-3' }),
                                                        row.variance < 0 && React.createElement(TrendingDown, { className: 'w-3 h-3' }),
                                                        row.variance
                                                    )
                                                ),
                                                React.createElement('td', { className: 'px-3 py-3 text-right mono' },
                                                    React.createElement('span', { 
                                                        className: `font-bold ${
                                                            row.revenueAdjustment > 0 ? 'text-emerald-400' : row.revenueAdjustment < 0 ? 'text-red-400' : 'text-slate-500'
                                                        }` 
                                                    },
                                                        `${row.revenueAdjustment >= 0 ? '+' : ''}$${row.revenueAdjustment.toFixed(2)}`
                                                    )
                                                ),
                                                React.createElement('td', { className: 'px-3 py-3 text-right text-emerald-400 mono font-medium' }, `$${row.margin.toFixed(2)}`)
                                            )
                                        )
                                    )
                                )
                            ),

                        React.createElement('div', { className: 'mt-6 p-4 bg-slate-800/50 rounded-lg border border-slate-700' },
                            React.createElement('p', { className: 'font-semibold text-sky-200 mb-2' }, 'Column Guide:'),
                            React.createElement('ul', { className: 'space-y-1 text-xs text-slate-300' },
                                React.createElement('li', null,
                                    React.createElement('strong', { className: 'text-sky-300' }, 'Rolling 12 Months:'), ' Historical quantities for up to the last 12 saved months'
                                ),
                                React.createElement('li', null,
                                    React.createElement('strong', { className: 'text-emerald-300' }, 'Current:'), ' Quantity from uploaded invoice | ',
                                    React.createElement('strong', { className: 'text-sky-300' }, 'Expected:'), ' Your planned billing quantity'
                                ),
                                React.createElement('li', null,
                                    React.createElement('strong', { className: 'text-sky-300' }, 'Variance:'), ' Current - Expected | ',
                                    React.createElement('strong', { className: 'text-sky-300' }, 'QB Adj:'), ' Revenue adjustment for QuickBooks'
                                ),
                                React.createElement('li', { className: 'mt-2 pt-2 border-t border-slate-700' },
                                    React.createElement('em', null, 'Tip: Month labels auto-parse from format "Sophos-MMYY" (e.g., Sophos-0126 = Jan 2026)')
                                )
                            )
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(SophosUsageTracker));
    </script>
</body>
</html>
