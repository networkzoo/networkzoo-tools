<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Usage Tracker & QuickBooks Adjustment Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel" data-type="module" data-presets="react">
        // Use window.React and window.ReactDOM directly
        const { useState, useMemo, useEffect } = React;

        // SVG Icons
        const Upload = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
        );

        const Download = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const Save = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
        );

        const AlertCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const TrendingUp = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const TrendingDown = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
            </svg>
        );

        const Minus = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" />
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        const SophosUsageTracker = () => {
            const [invoiceData, setInvoiceData] = useState([]);
            const [clientSkuConfig, setClientSkuConfig] = useState([]);
            const [newClientSku, setNewClientSku] = useState({
                clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0
            });
            const [uploadError, setUploadError] = useState('');
            const [currentMonthLabel, setCurrentMonthLabel] = useState('');
            const [historicalData, setHistoricalData] = useState({});
            const [configExpanded, setConfigExpanded] = useState(true);
            const [clientFilter, setClientFilter] = useState('');

            useEffect(() => {
                const saved = localStorage.getItem('sophosHistoricalData');
                if (saved) {
                    try {
                        setHistoricalData(JSON.parse(saved));
                    } catch (e) {
                        console.error('Error loading historical data:', e);
                    }
                }

                const savedConfig = localStorage.getItem('sophosClientSkuConfig');
                if (savedConfig) {
                    try {
                        setClientSkuConfig(JSON.parse(savedConfig));
                    } catch (e) {
                        console.error('Error loading client config:', e);
                    }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('sophosClientSkuConfig', JSON.stringify(clientSkuConfig));
            }, [clientSkuConfig]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploadError('');
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const text = event.target.result;
                            const lines = text.split('\n').filter(line => line.trim());
                            
                            if (lines.length < 2) {
                                setUploadError('File appears empty or has no data rows');
                                return;
                            }
                            
                            let delimiter = '\t';
                            if (!lines[0].includes('\t') && lines[0].includes(',')) {
                                delimiter = ',';
                            }
                            
                            const headers = lines[0].split(delimiter).map(h => h.trim().replace(/"/g, ''));
                            
                            const fileName = file.name;
                            let monthLabel = currentMonthLabel;
                            
                            const datePatterns = [
                                /(\d{4})-(\d{2})/,
                                /(\d{2})-(\d{4})/,
                                /(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s*(\d{4})/i,
                            ];
                            
                            for (const pattern of datePatterns) {
                                const match = fileName.match(pattern);
                                if (match) {
                                    monthLabel = match[0];
                                    break;
                                }
                            }
                            
                            if (!monthLabel) {
                                monthLabel = fileName.replace(/\.[^/.]+$/, "");
                            }
                            
                            const parsed = lines.slice(1).map(line => {
                                const values = line.split(delimiter).map(v => v.trim().replace(/"/g, ''));
                                const row = {};
                                headers.forEach((header, i) => {
                                    row[header] = values[i] || '';
                                });
                                row['_sourceFile'] = fileName;
                                row['_sourceMonth'] = monthLabel;
                                return row;
                            }).filter(row => row['End User Name'] && row['End User Name'].length > 0);
                            
                            if (parsed.length === 0) {
                                setUploadError(`Found headers but no valid data rows. Headers found: ${headers.join(', ')}`);
                                return;
                            }
                            
                            if (invoiceData.length > 0) {
                                const response = confirm(
                                    `Found ${parsed.length} rows from ${fileName} (${monthLabel}).\n\n` +
                                    'Add to existing data or replace?\n\n' +
                                    'OK = Add to existing\nCancel = Replace existing'
                                );
                                
                                if (response) {
                                    setInvoiceData([...invoiceData, ...parsed]);
                                    setUploadError('');
                                    setCurrentMonthLabel(monthLabel);
                                } else {
                                    setInvoiceData(parsed);
                                    setUploadError('');
                                    setCurrentMonthLabel(monthLabel);
                                }
                            } else {
                                setInvoiceData(parsed);
                                setUploadError('');
                                setCurrentMonthLabel(monthLabel);
                            }
                            
                        } catch (err) {
                            setUploadError(`Error parsing file: ${err.message}`);
                        }
                    };
                    reader.onerror = () => {
                        setUploadError('Error reading file');
                    };
                    reader.readAsText(file);
                }
            };

            const clearInvoiceData = () => {
                if (confirm('Clear all uploaded invoice data?')) {
                    setInvoiceData([]);
                }
            };

            const addClientSku = () => {
                if (newClientSku.clientName && newClientSku.sku) {
                    setClientSkuConfig([...clientSkuConfig, { ...newClientSku }]);
                    setNewClientSku({ clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0 });
                }
            };

            const importClientSkusFromInvoice = () => {
                const clientSkuPairs = invoiceData.map(row => {
                    const endUserName = row['End User Name'];
                    const serialNumber = row['Serial Number'];
                    const sku = row['Sku'];
                    
                    let clientName;
                    if (!endUserName || endUserName.trim() === '***' || endUserName.trim() === '') {
                        clientName = serialNumber ? `SN: ${serialNumber}` : null;
                    } else {
                        clientName = endUserName;
                    }
                    
                    return clientName && sku ? { clientName, sku } : null;
                }).filter(Boolean);
                
                const uniquePairs = [];
                const seen = new Set();
                
                clientSkuPairs.forEach(pair => {
                    const key = `${pair.clientName}|||${pair.sku}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        uniquePairs.push(pair);
                    }
                });
                
                const newConfigs = uniquePairs
                    .filter(pair => !clientSkuConfig.some(c => 
                        c.clientName === pair.clientName && c.sku === pair.sku
                    ))
                    .map(pair => {
                        const invoice = invoiceData.find(inv => {
                            const invClientName = inv['End User Name'] === '***' 
                                ? `SN: ${inv['Serial Number']}`
                                : inv['End User Name'];
                            return invClientName === pair.clientName && inv['Sku'] === pair.sku;
                        });
                        
                        let defaultRate = 0;
                        let description = '';
                        if (invoice) {
                            const unitPrice = parseFloat(invoice['Unit Price']) || 0;
                            defaultRate = Math.round(unitPrice * 1.4 * 100) / 100;
                            description = invoice['Description'] || '';
                        }
                        
                        return {
                            clientName: pair.clientName,
                            sku: pair.sku,
                            description: description,
                            trackUsage: true,
                            expectedQty: 0,
                            billingRate: defaultRate
                        };
                    });
                
                if (newConfigs.length > 0) {
                    setClientSkuConfig([...clientSkuConfig, ...newConfigs]);
                }
            };

            const saveCurrentMonth = () => {
                if (!currentMonthLabel.trim()) {
                    alert('Please enter a month label (e.g., "Jan 2025" or "2025-01")');
                    return;
                }

                const monthData = {
                    label: currentMonthLabel,
                    timestamp: new Date().toISOString(),
                    data: comparisonData.map(row => ({
                        clientName: row.clientName,
                        sku: row.sku,
                        actualQty: row.actualQty,
                        actualCost: row.actualCost,
                        suggestedRevenue: row.suggestedRevenue
                    }))
                };

                const updated = { ...historicalData, [currentMonthLabel]: monthData };
                setHistoricalData(updated);
                localStorage.setItem('sophosHistoricalData', JSON.stringify(updated));
                alert(`Saved data for ${currentMonthLabel}!`);
            };

            const clearHistoricalData = () => {
                if (confirm('Are you sure you want to clear all historical data? This cannot be undone.')) {
                    setHistoricalData({});
                    localStorage.removeItem('sophosHistoricalData');
                }
            };

            const removeClientSku = (index) => {
                setClientSkuConfig(clientSkuConfig.filter((_, i) => i !== index));
            };

            const updateClientSku = (index, field, value) => {
                const updated = [...clientSkuConfig];
                updated[index][field] = value;
                setClientSkuConfig(updated);
            };

            const comparisonData = useMemo(() => {
                return clientSkuConfig
                    .filter(config => config.trackUsage)
                    .map(config => {
                        const clientInvoices = invoiceData.filter(inv => {
                            const endUserName = inv['End User Name'];
                            const serialNumber = inv['Serial Number'];
                            const invSku = inv['Sku'];
                            
                            if (config.clientName.startsWith('SN: ')) {
                                const clientSerial = config.clientName.replace('SN: ', '');
                                return serialNumber === clientSerial && invSku === config.sku;
                            }
                            
                            const matchesName = endUserName?.toLowerCase().includes(config.clientName.toLowerCase());
                            const matchesSku = invSku === config.sku;
                            
                            return matchesName && matchesSku;
                        });
                        
                        const actualQty = clientInvoices.reduce((sum, inv) => {
                            return sum + (parseInt(inv['Qty']) || 0);
                        }, 0);
                        
                        const actualCost = clientInvoices.reduce((sum, inv) => {
                            return sum + (parseFloat(inv['Ext Price']) || 0);
                        }, 0);
                        
                        const variance = actualQty - config.expectedQty;
                        
                        let expectedRevenue, suggestedRevenue;
                        if (config.billingRate > 0) {
                            expectedRevenue = config.expectedQty * config.billingRate;
                            suggestedRevenue = actualQty * config.billingRate;
                        } else {
                            expectedRevenue = actualCost * 1.4;
                            suggestedRevenue = actualCost * 1.4;
                        }
                        
                        const revenueAdjustment = suggestedRevenue - expectedRevenue;
                        
                        return {
                            clientName: config.clientName,
                            sku: config.sku,
                            description: config.description || '',
                            expectedQty: config.expectedQty,
                            actualQty,
                            variance,
                            billingRate: config.billingRate,
                            expectedRevenue,
                            suggestedRevenue,
                            revenueAdjustment,
                            actualCost,
                            margin: suggestedRevenue - actualCost,
                            invoiceCount: clientInvoices.length
                        };
                    });
            }, [clientSkuConfig, invoiceData]);

            const comparisonWithTrends = useMemo(() => {
                const months = Object.keys(historicalData).sort();
                if (months.length === 0) {
                    return comparisonData.map(row => ({ ...row, trend: null, trendQty: 0, trendPct: 0 }));
                }

                const lastMonth = historicalData[months[months.length - 1]];
                
                return comparisonData.map(row => {
                    const lastMonthData = lastMonth.data.find(d => 
                        d.clientName === row.clientName && d.sku === row.sku
                    );
                    
                    if (!lastMonthData) {
                        return { ...row, trend: 'new', trendQty: 0, trendPct: 0 };
                    }

                    const qtyChange = row.actualQty - lastMonthData.actualQty;
                    const pctChange = lastMonthData.actualQty > 0 
                        ? ((qtyChange / lastMonthData.actualQty) * 100)
                        : 0;

                    let trend = 'stable';
                    if (qtyChange > 0) trend = 'up';
                    else if (qtyChange < 0) trend = 'down';

                    return {
                        ...row,
                        trend,
                        trendQty: qtyChange,
                        trendPct: pctChange,
                        lastMonthQty: lastMonthData.actualQty
                    };
                });
            }, [comparisonData, historicalData]);

            const downloadCSV = (data, filename) => {
                const headers = Object.keys(data[0] || {});
                const csv = [
                    headers.join(','),
                    ...data.map(row => headers.map(h => `"${row[h] ?? ''}"`).join(','))
                ].join('\n');
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
            };

            const totals = useMemo(() => {
                return comparisonData.reduce((acc, row) => ({
                    totalAdjustment: acc.totalAdjustment + row.revenueAdjustment,
                    totalMargin: acc.totalMargin + row.margin,
                    totalCost: acc.totalCost + row.actualCost,
                    totalRevenue: acc.totalRevenue + row.suggestedRevenue
                }), { totalAdjustment: 0, totalMargin: 0, totalCost: 0, totalRevenue: 0 });
            }, [comparisonData]);

            const savedMonths = Object.keys(historicalData).sort();

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">Sophos Usage Tracker</h1>
                            <p className="text-gray-600">Import Climb invoices, configure per-SKU client billing, and generate QuickBooks adjustment reports with month-to-month trend tracking</p>
                            
                            {savedMonths.length > 0 && (
                                <div className="mt-4 p-3 bg-blue-50 rounded-lg">
                                    <p className="text-sm text-blue-900">
                                        <strong>Historical Data:</strong> {savedMonths.length} month(s) saved — {savedMonths.join(', ')}
                                    </p>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                <Upload className="w-5 h-5" />
                                Step 1: Import Climb Invoice Data
                            </h2>
                            <div className="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
                                <input
                                    type="file"
                                    accept=".csv,.txt,.tsv"
                                    onChange={handleFileUpload}
                                    className="hidden"
                                    id="file-upload"
                                />
                                <label htmlFor="file-upload" className="cursor-pointer">
                                    <Upload className="w-12 h-12 mx-auto text-gray-400 mb-4" />
                                    <p className="text-sm text-gray-600">Click to upload or drag and drop</p>
                                    <p className="text-xs text-gray-500 mt-1">CSV, TXT, or TSV (tab-separated)</p>
                                </label>
                            </div>
                            {uploadError && (
                                <div className="mt-4 p-4 bg-red-50 rounded-lg">
                                    <p className="text-sm text-red-800">⚠ {uploadError}</p>
                                </div>
                            )}
                            {invoiceData.length > 0 && (
                                <div className="mt-4 p-4 bg-green-50 rounded-lg">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="text-sm text-green-800">✓ Loaded {invoiceData.length} invoice line items</p>
                                            <p className="text-xs text-green-700 mt-1">
                                                Sample: {invoiceData[0]['End User Name']} - {invoiceData[0]['Description']} - SKU: {invoiceData[0]['Sku']} (Qty: {invoiceData[0]['Qty']})
                                            </p>
                                        </div>
                                        <button
                                            onClick={clearInvoiceData}
                                            className="text-sm text-red-600 hover:text-red-800"
                                        >
                                            Clear Data
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <button
                                onClick={() => setConfigExpanded(!configExpanded)}
                                className="flex items-center justify-between w-full mb-4"
                            >
                                <h2 className="text-lg font-semibold flex items-center gap-2">
                                    <span className="text-lg">{configExpanded ? '▼' : '▶'}</span>
                                    Step 2: Configure Client-SKU Billing
                                </h2>
                                <span className="text-sm text-gray-500">
                                    {configExpanded ? 'Click to collapse' : 'Click to expand'} ({clientSkuConfig.length} configured)
                                </span>
                            </button>
                            
                            {configExpanded && (
                                <>
                                    {invoiceData.length > 0 && (
                                        <div className="mb-4">
                                            <button
                                                onClick={importClientSkusFromInvoice}
                                                className="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 text-sm"
                                            >
                                                Import Client-SKU Pairs from Invoice
                                            </button>
                                        </div>
                                    )}
                                    
                                    <div className="mb-4 p-3 bg-yellow-50 rounded-lg">
                                        <p className="text-sm text-yellow-900">
                                            <strong>Note:</strong> Each client-SKU combination is tracked separately for accurate per-product billing and trend analysis.
                                        </p>
                                    </div>

                                    <div className="mb-6 p-4 bg-gray-50 rounded-lg">
                                        <h3 className="text-sm font-medium mb-3">Add New Client-SKU</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-8 gap-3">
                                            <input
                                                type="text"
                                                placeholder="Client Name"
                                                value={newClientSku.clientName}
                                                onChange={(e) => setNewClientSku({...newClientSku, clientName: e.target.value})}
                                                className="px-3 py-2 border rounded-md"
                                            />
                                            <input
                                                type="text"
                                                placeholder="SKU"
                                                value={newClientSku.sku}
                                                onChange={(e) => setNewClientSku({...newClientSku, sku: e.target.value})}
                                                className="px-3 py-2 border rounded-md"
                                            />
                                            <input
                                                type="text"
                                                placeholder="Description"
                                                value={newClientSku.description}
                                                onChange={(e) => setNewClientSku({...newClientSku, description: e.target.value})}
                                                className="px-3 py-2 border rounded-md col-span-2"
                                            />
                                            <input
                                                type="number"
                                                placeholder="Expected Qty"
                                                value={newClientSku.expectedQty}
                                                onChange={(e) => setNewClientSku({...newClientSku, expectedQty: parseFloat(e.target.value) || 0})}
                                                className="px-3 py-2 border rounded-md"
                                            />
                                            <input
                                                type="number"
                                                step="0.01"
                                                placeholder="Billing Rate"
                                                value={newClientSku.billingRate}
                                                onChange={(e) => setNewClientSku({...newClientSku, billingRate: parseFloat(e.target.value) || 0})}
                                                className="px-3 py-2 border rounded-md"
                                            />
                                            <label className="flex items-center gap-2 px-3 py-2">
                                                <input
                                                    type="checkbox"
                                                    checked={newClientSku.trackUsage}
                                                    onChange={(e) => setNewClientSku({...newClientSku, trackUsage: e.target.checked})}
                                                    className="rounded"
                                                />
                                                <span className="text-sm">Track</span>
                                            </label>
                                            <button
                                                onClick={addClientSku}
                                                className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
                                            >
                                                Add
                                            </button>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-100">
                                                <tr>
                                                    <th className="px-4 py-2 text-left">Client</th>
                                                    <th className="px-4 py-2 text-left">Description</th>
                                                    <th className="px-4 py-2 text-left text-xs">SKU</th>
                                                    <th className="px-4 py-2 text-right">Expected</th>
                                                    <th className="px-4 py-2 text-right">Rate</th>
                                                    <th className="px-4 py-2 text-center">Track</th>
                                                    <th className="px-4 py-2"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {clientSkuConfig.map((config, idx) => (
                                                    <tr key={idx} className="border-b">
                                                        <td className="px-4 py-2">
                                                            <input
                                                                type="text"
                                                                value={config.clientName}
                                                                onChange={(e) => updateClientSku(idx, 'clientName', e.target.value)}
                                                                className="w-full px-2 py-1 border rounded text-sm"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-2">
                                                            <input
                                                                type="text"
                                                                value={config.description || ''}
                                                                onChange={(e) => updateClientSku(idx, 'description', e.target.value)}
                                                                className="w-full px-2 py-1 border rounded text-sm"
                                                                placeholder="Product description"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-2">
                                                            <input
                                                                type="text"
                                                                value={config.sku}
                                                                onChange={(e) => updateClientSku(idx, 'sku', e.target.value)}
                                                                className="w-full px-2 py-1 border rounded font-mono text-xs"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-2">
                                                            <input
                                                                type="number"
                                                                value={config.expectedQty}
                                                                onChange={(e) => updateClientSku(idx, 'expectedQty', parseFloat(e.target.value) || 0)}
                                                                className="w-full px-2 py-1 border rounded text-right"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-2">
                                                            <input
                                                                type="number"
                                                                step="0.01"
                                                                value={config.billingRate}
                                                                onChange={(e) => updateClientSku(idx, 'billingRate', parseFloat(e.target.value) || 0)}
                                                                className="w-full px-2 py-1 border rounded text-right"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-2 text-center">
                                                            <input
                                                                type="checkbox"
                                                                checked={config.trackUsage}
                                                                onChange={(e) => updateClientSku(idx, 'trackUsage', e.target.checked)}
                                                                className="rounded"
                                                            />
                                                        </td>
                                                        <td className="px-4 py-2">
                                                            <button
                                                                onClick={() => removeClientSku(idx)}
                                                                className="text-red-600 hover:text-red-800 text-xs"
                                                            >
                                                                Remove
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </>
                            )}
                        </div>

                        {comparisonData.length > 0 && (
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                    <Calendar className="w-5 h-5" />
                                    Step 3: Save This Month's Data
                                </h2>
                                <div className="flex items-center gap-4">
                                    <input
                                        type="text"
                                        placeholder="e.g., Jan 2025"
                                        value={currentMonthLabel}
                                        onChange={(e) => setCurrentMonthLabel(e.target.value)}
                                        className="flex-1 px-4 py-2 border rounded-md"
                                    />
                                    <button
                                        onClick={saveCurrentMonth}
                                        className="flex items-center gap-2 px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
                                    >
                                        <Save className="w-4 h-4" />
                                        Save Month
                                    </button>
                                    {savedMonths.length > 0 && (
                                        <button
                                            onClick={clearHistoricalData}
                                            className="px-4 py-2 bg-red-100 text-red-700 rounded-md hover:bg-red-200 text-sm"
                                        >
                                            Clear History
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {comparisonWithTrends.length > 0 && (
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <div className="flex items-center gap-4">
                                        <h2 className="text-lg font-semibold">Step 4: Usage Comparison</h2>
                                        <input
                                            type="text"
                                            placeholder="Filter by client name..."
                                            value={clientFilter}
                                            onChange={(e) => setClientFilter(e.target.value)}
                                            className="px-3 py-1 border rounded-md text-sm w-64"
                                        />
                                        {clientFilter && (
                                            <button
                                                onClick={() => setClientFilter('')}
                                                className="text-sm text-blue-600 hover:text-blue-800"
                                            >
                                                Clear filter
                                            </button>
                                        )}
                                    </div>
                                    <button
                                        onClick={() => downloadCSV(comparisonWithTrends, 'sophos-qb-adjustments.csv')}
                                        className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700"
                                    >
                                        <Download className="w-4 h-4" />
                                        Export CSV
                                    </button>
                                </div>

                                {(() => {
                                    const filteredData = clientFilter 
                                        ? comparisonWithTrends.filter(row => 
                                            row.clientName.toLowerCase().includes(clientFilter.toLowerCase())
                                        )
                                        : comparisonWithTrends;
                                    
                                    const filteredTotals = filteredData.reduce((acc, row) => ({
                                        totalAdjustment: acc.totalAdjustment + row.revenueAdjustment,
                                        totalMargin: acc.totalMargin + row.margin,
                                        totalCost: acc.totalCost + row.actualCost,
                                        totalRevenue: acc.totalRevenue + row.suggestedRevenue
                                    }), { totalAdjustment: 0, totalMargin: 0, totalCost: 0, totalRevenue: 0 });
                                    
                                    return (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                                <div className="p-4 bg-blue-50 rounded-lg">
                                                    <p className="text-sm text-gray-600">Total Adjustment</p>
                                                    <p className={`text-2xl font-bold ${filteredTotals.totalAdjustment >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                        ${filteredTotals.totalAdjustment.toFixed(2)}
                                                    </p>
                                                    {clientFilter && (
                                                        <p className="text-xs text-gray-500 mt-1">Filtered</p>
                                                    )}
                                                </div>
                                                <div className="p-4 bg-green-50 rounded-lg">
                                                    <p className="text-sm text-gray-600">Total Revenue</p>
                                                    <p className="text-2xl font-bold text-gray-900">${filteredTotals.totalRevenue.toFixed(2)}</p>
                                                </div>
                                                <div className="p-4 bg-purple-50 rounded-lg">
                                                    <p className="text-sm text-gray-600">Total Cost</p>
                                                    <p className="text-2xl font-bold text-gray-900">${filteredTotals.totalCost.toFixed(2)}</p>
                                                </div>
                                                <div className="p-4 bg-yellow-50 rounded-lg">
                                                    <p className="text-sm text-gray-600">Total Margin</p>
                                                    <p className="text-2xl font-bold text-gray-900">${filteredTotals.totalMargin.toFixed(2)}</p>
                                                </div>
                                            </div>

                                            {filteredData.length === 0 ? (
                                                <div className="text-center py-8 text-gray-500">
                                                    No clients match "{clientFilter}"
                                                </div>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm">
                                                        <thead className="bg-gray-100">
                                                            <tr>
                                                                <th className="px-4 py-2 text-left">Client</th>
                                                                <th className="px-4 py-2 text-left">Description</th>
                                                                <th className="px-4 py-2 text-right">Last Mo</th>
                                                                <th className="px-4 py-2 text-right">This Mo</th>
                                                                <th className="px-4 py-2 text-right">Change</th>
                                                                <th className="px-4 py-2 text-right">Expected</th>
                                                                <th className="px-4 py-2 text-right">Variance</th>
                                                                <th className="px-4 py-2 text-right">QB Adj</th>
                                                                <th className="px-4 py-2 text-right">Cost</th>
                                                                <th className="px-4 py-2 text-right">Margin</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {filteredData.map((row, idx) => (
                                                                <tr key={idx} className="border-b hover:bg-gray-50">
                                                                    <td className="px-4 py-2 font-medium text-sm">{row.clientName}</td>
                                                                    <td className="px-4 py-2 text-sm" title={`SKU: ${row.sku}`}>{row.description || row.sku}</td>
                                                                    <td className="px-4 py-2 text-right text-gray-600">
                                                                        {row.lastMonthQty !== undefined ? row.lastMonthQty : '-'}
                                                                    </td>
                                                                    <td className="px-4 py-2 text-right font-medium">{row.actualQty}</td>
                                                                    <td className="px-4 py-2 text-right">
                                                                        {row.trend === 'new' ? (
                                                                            <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">NEW</span>
                                                                        ) : row.trend === 'up' ? (
                                                                            <span className="flex items-center justify-end gap-1 text-orange-600 font-medium">
                                                                                <TrendingUp className="w-3 h-3" />
                                                                                +{row.trendQty}
                                                                            </span>
                                                                        ) : row.trend === 'down' ? (
                                                                            <span className="flex items-center justify-end gap-1 text-blue-600 font-medium">
                                                                                <TrendingDown className="w-3 h-3" />
                                                                                {row.trendQty}
                                                                            </span>
                                                                        ) : row.trend === 'stable' ? (
                                                                            <span className="text-gray-500">-</span>
                                                                        ) : (
                                                                            <span className="text-gray-400">-</span>
                                                                        )}
                                                                    </td>
                                                                    <td className="px-4 py-2 text-right text-gray-600">{row.expectedQty || '-'}</td>
                                                                    <td className="px-4 py-2 text-right">
                                                                        <span className={`flex items-center justify-end gap-1 ${
                                                                            row.variance > 0 ? 'text-red-600' : row.variance < 0 ? 'text-green-600' : 'text-gray-600'
                                                                        }`}>
                                                                            {row.variance > 0 && <TrendingUp className="w-3 h-3" />}
                                                                            {row.variance < 0 && <TrendingDown className="w-3 h-3" />}
                                                                            {row.variance === 0 && <Minus className="w-3 h-3" />}
                                                                            {row.variance}
                                                                        </span>
                                                                    </td>
                                                                    <td className="px-4 py-2 text-right">
                                                                        <span className={`font-bold ${
                                                                            row.revenueAdjustment > 0 ? 'text-green-600' : row.revenueAdjustment < 0 ? 'text-red-600' : 'text-gray-600'
                                                                        }`}>
                                                                            {row.revenueAdjustment >= 0 ? '+' : ''}${row.revenueAdjustment.toFixed(2)}
                                                                        </span>
                                                                    </td>
                                                                    <td className="px-4 py-2 text-right">${row.actualCost.toFixed(2)}</td>
                                                                    <td className="px-4 py-2 text-right text-green-600">${row.margin.toFixed(2)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </>
                                    );
                                })()}

                                <div className="mt-6 p-4 bg-blue-50 rounded-lg text-sm text-blue-900">
                                    <p className="font-medium mb-2">Column Guide:</p>
                                    <ul className="space-y-1 text-xs">
                                        <li><strong>Last Mo:</strong> Quantity from last saved month | <strong>This Mo:</strong> Current invoice quantity</li>
                                        <li><strong>Change:</strong> Month-to-month difference (This Mo - Last Mo)</li>
                                        <li><strong>Expected:</strong> Your planned billing quantity | <strong>Variance:</strong> This Mo - Expected</li>
                                        <li><strong>QB Adj:</strong> Revenue adjustment needed on QuickBooks invoice</li>
                                        <li className="mt-2 pt-2 border-t border-blue-200"><em>Tip: Hover over Description to see SKU</em></li>
                                    </ul>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SophosUsageTracker />);
    </script>
</body>
</html>
