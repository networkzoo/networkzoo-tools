<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Tracker</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        function SophosTracker() {
            const [invoiceData, setInvoiceData] = useState([]);
            const [clientConfig, setClientConfig] = useState([]);
            const [newClient, setNewClient] = useState({ clientName: '', trackUsage: true, expectedQty: 0, billingRate: 0, sku: '' });
            const [uploadError, setUploadError] = useState('');
            const [currentMonthLabel, setCurrentMonthLabel] = useState('');
            const [historicalData, setHistoricalData] = useState({});

            useEffect(() => {
                const saved = localStorage.getItem('sophosHistoricalData');
                if (saved) try { setHistoricalData(JSON.parse(saved)); } catch (e) { console.error(e); }
                const savedConfig = localStorage.getItem('sophosClientConfig');
                if (savedConfig) try { setClientConfig(JSON.parse(savedConfig)); } catch (e) { console.error(e); }
            }, []);

            useEffect(() => {
                localStorage.setItem('sophosClientConfig', JSON.stringify(clientConfig));
            }, [clientConfig]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploadError('');
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const lines = text.split('\n').filter(line => line.trim());
                        if (lines.length < 2) { setUploadError('File appears empty'); return; }
                        const delimiter = lines[0].includes('\t') ? '\t' : ',';
                        const headers = lines[0].split(delimiter).map(h => h.trim().replace(/"/g, ''));
                        const parsed = lines.slice(1).map(line => {
                            const values = line.split(delimiter).map(v => v.trim().replace(/"/g, ''));
                            const row = {};
                            headers.forEach((header, i) => { row[header] = values[i] || ''; });
                            return row;
                        }).filter(row => row['End User Name']?.length > 0);
                        if (parsed.length === 0) { setUploadError('No valid data'); return; }
                        setInvoiceData(parsed);
                    } catch (err) { setUploadError(err.message); }
                };
                reader.readAsText(file);
            };

            const addClient = () => {
                if (newClient.clientName) {
                    setClientConfig([...clientConfig, { ...newClient }]);
                    setNewClient({ clientName: '', trackUsage: true, expectedQty: 0, billingRate: 0, sku: '' });
                }
            };

            const importClients = () => {
                const names = [...new Set(invoiceData.map(r => r['End User Name']).filter(Boolean))];
                const newClients = names.filter(n => !clientConfig.some(c => c.clientName === n))
                    .map(n => ({ clientName: n, trackUsage: true, expectedQty: 0, billingRate: 0, sku: '' }));
                if (newClients.length > 0) setClientConfig([...clientConfig, ...newClients]);
            };

            const saveMonth = () => {
                if (!currentMonthLabel.trim()) { alert('Enter month label'); return; }
                const data = {
                    label: currentMonthLabel,
                    timestamp: new Date().toISOString(),
                    data: comparisonData.map(r => ({ clientName: r.clientName, sku: r.sku, actualQty: r.actualQty, actualCost: r.actualCost, suggestedRevenue: r.suggestedRevenue }))
                };
                const updated = { ...historicalData, [currentMonthLabel]: data };
                setHistoricalData(updated);
                localStorage.setItem('sophosHistoricalData', JSON.stringify(updated));
                alert(`Saved ${currentMonthLabel}!`);
            };

            const comparisonData = useMemo(() => {
                const rows = [];
                clientConfig.filter(c => c.trackUsage).forEach(client => {
                    const clientInvs = invoiceData.filter(inv => inv['End User Name']?.toLowerCase().includes(client.clientName.toLowerCase()));
                    const skuGroups = {};
                    clientInvs.forEach(inv => {
                        const sku = inv['Sku'] || 'NO-SKU';
                        if (!skuGroups[sku]) skuGroups[sku] = [];
                        skuGroups[sku].push(inv);
                    });
                    const skus = client.sku ? [client.sku] : Object.keys(skuGroups);
                    skus.forEach(sku => {
                        const skuInvs = skuGroups[sku] || [];
                        const actualQty = skuInvs.reduce((s, i) => s + (parseInt(i['Qty']) || 0), 0);
                        const actualCost = skuInvs.reduce((s, i) => s + (parseFloat(i['Ext Price']) || 0), 0);
                        const totalQty = Object.values(skuGroups).flat().reduce((s, i) => s + (parseInt(i['Qty']) || 0), 0);
                        const portion = totalQty > 0 ? actualQty / totalQty : 0;
                        const expectedQty = client.sku ? client.expectedQty : Math.round(client.expectedQty * portion);
                        const variance = actualQty - expectedQty;
                        let expectedRev, suggestedRev;
                        if (client.billingRate > 0) {
                            expectedRev = expectedQty * client.billingRate;
                            suggestedRev = actualQty * client.billingRate;
                        } else {
                            expectedRev = actualCost * 1.4;
                            suggestedRev = actualCost * 1.4;
                        }
                       const description = skuInvs[0]?.['Description'] || '';
rows.push({
    clientName: client.clientName, sku, description, expectedQty, actualQty, variance,
    billingRate: client.billingRate, expectedRevenue: expectedRev, suggestedRevenue: suggestedRev,
    revenueAdjustment: suggestedRev - expectedRev, actualCost, margin: suggestedRev - actualCost
});
                    });
                });
                return rows;
            }, [clientConfig, invoiceData]);

const withTrends = useMemo(() => {
    const months = Object.keys(historicalData).sort();
    if (months.length === 0) return comparisonData.map(r => ({ ...r, trend: null, trendQty: 0, trendPct: 0 }));
    const last = historicalData[months[months.length - 1]];
    return comparisonData.map(row => {
        const lastData = last.data.find(d => d.clientName === row.clientName && d.sku === row.sku);
        if (!lastData) return { ...row, trend: 'new', trendQty: 0, trendPct: 0 };
        
        // USE LAST MONTH AS EXPECTED
        const expectedQty = lastData.actualQty;
        const change = row.actualQty - expectedQty;
        const pct = expectedQty > 0 ? (change / expectedQty) * 100 : 0;
        
        // Recalculate revenue based on last month's qty
        let expectedRevenue;
        if (row.billingRate > 0) {
            expectedRevenue = expectedQty * row.billingRate;
        } else {
            expectedRevenue = (row.actualCost / row.actualQty) * expectedQty * 1.4;
        }
        const revenueAdjustment = row.suggestedRevenue - expectedRevenue;
        
        return { 
            ...row, 
            expectedQty,
            variance: change,
            expectedRevenue,
            revenueAdjustment,
            trend: change > 0 ? 'up' : change < 0 ? 'down' : 'stable', 
            trendQty: change, 
            trendPct: pct 
        };
    });
}, [comparisonData, historicalData]);

               const months = Object.keys(historicalData).sort();
                if (months.length === 0) return comparisonData.map(r => ({ ...r, trend: null, trendQty: 0, trendPct: 0 }));
                const last = historicalData[months[months.length - 1]];
                return comparisonData.map(row => {
                    const lastData = last.data.find(d => d.clientName === row.clientName && d.sku === row.sku);
                    if (!lastData) return { ...row, trend: 'new', trendQty: 0, trendPct: 0 };
                    const change = row.actualQty - lastData.actualQty;
                    const pct = lastData.actualQty > 0 ? (change / lastData.actualQty) * 100 : 0;
                    return { ...row, trend: change > 0 ? 'up' : change < 0 ? 'down' : 'stable', trendQty: change, trendPct: pct };
                });
            }, [comparisonData, historicalData]);

            const download = (data, name) => {
                const headers = Object.keys(data[0] || {});
                const csv = [headers.join(','), ...data.map(r => headers.map(h => `"${r[h] ?? ''}"`).join(','))].join('\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
                a.download = name;
                a.click();
            };

            const totals = useMemo(() => comparisonData.reduce((a, r) => ({
                totalAdjustment: a.totalAdjustment + r.revenueAdjustment,
                totalMargin: a.totalMargin + r.margin,
                totalCost: a.totalCost + r.actualCost,
                totalRevenue: a.totalRevenue + r.suggestedRevenue
            }), { totalAdjustment: 0, totalMargin: 0, totalCost: 0, totalRevenue: 0 }), [comparisonData]);

            const months = Object.keys(historicalData).sort();

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        <div className="bg-white rounded-lg shadow p-6">
                            <h1 className="text-2xl font-bold mb-2">Sophos Usage Tracker</h1>
                            <p className="text-gray-600">Track usage by SKU with month-to-month trends</p>
                            {months.length > 0 && <div className="mt-4 p-3 bg-blue-50 rounded"><p className="text-sm text-blue-900">Saved: {months.join(', ')}</p></div>}
                        </div>

                        <div className="bg-white rounded-lg shadow p-6">
                            <h2 className="text-lg font-semibold mb-4">Step 1: Import Invoice</h2>
                            <input type="file" accept=".csv,.txt,.tsv" onChange={handleFileUpload} className="block w-full text-sm border rounded p-2" />
                            {uploadError && <div className="mt-4 p-4 bg-red-50 rounded text-red-800 text-sm">⚠ {uploadError}</div>}
                            {invoiceData.length > 0 && <div className="mt-4 p-4 bg-green-50 rounded text-green-800 text-sm">✓ Loaded {invoiceData.length} items</div>}
                        </div>

                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="flex justify-between mb-4">
                                <h2 className="text-lg font-semibold">Step 2: Configure Clients</h2>
                                {invoiceData.length > 0 && <button onClick={importClients} className="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 text-sm">Import Clients</button>}
                            </div>
                            <div className="mb-6 p-4 bg-gray-50 rounded grid grid-cols-6 gap-3">
                                <input type="text" placeholder="Client" value={newClient.clientName} onChange={e => setNewClient({...newClient, clientName: e.target.value})} className="px-3 py-2 border rounded" />
                                <input type="text" placeholder="SKU" value={newClient.sku} onChange={e => setNewClient({...newClient, sku: e.target.value})} className="px-3 py-2 border rounded" />
                                <input type="number" placeholder="Expected" value={newClient.expectedQty} onChange={e => setNewClient({...newClient, expectedQty: +e.target.value || 0})} className="px-3 py-2 border rounded" />
                                <input type="number" step="0.01" placeholder="Rate" value={newClient.billingRate} onChange={e => setNewClient({...newClient, billingRate: +e.target.value || 0})} className="px-3 py-2 border rounded" />
                                <label className="flex items-center gap-2"><input type="checkbox" checked={newClient.trackUsage} onChange={e => setNewClient({...newClient, trackUsage: e.target.checked})} /><span className="text-sm">Track</span></label>
                                <button onClick={addClient} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
                            </div>
                            <table className="w-full text-sm">
                                <thead className="bg-gray-100"><tr><th className="px-4 py-2 text-left">Client</th><th className="px-4 py-2 text-left">SKU</th><th className="px-4 py-2 text-left">Description</th><th className="px-4 py-2 text-right">Exp</th>...</thead>
                                <tbody>
                                    {clientConfig.map((c, i) => (
                                        <tr key={i} className="border-b">
                                            <td className="px-4 py-2"><input type="text" value={c.clientName} onChange={e => { const u = [...clientConfig]; u[i].clientName = e.target.value; setClientConfig(u); }} className="w-full px-2 py-1 border rounded" /></td>
                                            <td className="px-4 py-2"><input type="text" value={c.sku} onChange={e => { const u = [...clientConfig]; u[i].sku = e.target.value; setClientConfig(u); }} className="w-full px-2 py-1 border rounded" /></td>
                                            <td className="px-4 py-2"><input type="number" value={c.expectedQty} onChange={e => { const u = [...clientConfig]; u[i].expectedQty = +e.target.value || 0; setClientConfig(u); }} className="w-full px-2 py-1 border rounded text-right" /></td>
                                            <td className="px-4 py-2"><input type="number" step="0.01" value={c.billingRate} onChange={e => { const u = [...clientConfig]; u[i].billingRate = +e.target.value || 0; setClientConfig(u); }} className="w-full px-2 py-1 border rounded text-right" /></td>
                                            <td className="px-4 py-2 text-center"><input type="checkbox" checked={c.trackUsage} onChange={e => { const u = [...clientConfig]; u[i].trackUsage = e.target.checked; setClientConfig(u); }} /></td>
                                            <td className="px-4 py-2"><button onClick={() => setClientConfig(clientConfig.filter((_, j) => j !== i))} className="text-red-600 hover:text-red-800">Remove</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {comparisonData.length > 0 && (
                            <div className="bg-white rounded-lg shadow p-6">
                                <h2 className="text-lg font-semibold mb-4">Step 3: Save Month</h2>
                                <div className="flex gap-4">
                                    <input type="text" placeholder="e.g., Jan 2025" value={currentMonthLabel} onChange={e => setCurrentMonthLabel(e.target.value)} className="flex-1 px-4 py-2 border rounded" />
                                    <button onClick={saveMonth} className="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                                    {months.length > 0 && <button onClick={() => { if (confirm('Clear?')) { setHistoricalData({}); localStorage.removeItem('sophosHistoricalData'); }}} className="px-4 py-2 bg-red-100 text-red-700 rounded hover:bg-red-200">Clear</button>}
                                </div>
                            </div>
                        )}

                        {withTrends.length > 0 && (
                            <div className="bg-white rounded-lg shadow p-6">
                                <div className="flex justify-between mb-4">
                                    <h2 className="text-lg font-semibold">Step 4: QB Adjustments</h2>
                                    <button onClick={() => download(withTrends, 'sophos.csv')} className="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Export CSV</button>
                                </div>
                                <div className="grid grid-cols-4 gap-4 mb-6">
                                    <div className="p-4 bg-blue-50 rounded"><p className="text-sm text-gray-600">Total Adjustment</p><p className={`text-2xl font-bold ${totals.totalAdjustment >= 0 ? 'text-green-600' : 'text-red-600'}`}>${totals.totalAdjustment.toFixed(2)}</p></div>
                                    <div className="p-4 bg-green-50 rounded"><p className="text-sm text-gray-600">Revenue</p><p className="text-2xl font-bold">${totals.totalRevenue.toFixed(2)}</p></div>
                                    <div className="p-4 bg-purple-50 rounded"><p className="text-sm text-gray-600">Cost</p><p className="text-2xl font-bold">${totals.totalCost.toFixed(2)}</p></div>
                                    <div className="p-4 bg-yellow-50 rounded"><p className="text-sm text-gray-600">Margin</p><p className="text-2xl font-bold">${totals.totalMargin.toFixed(2)}</p></div>
                                </div>
                                <table className="w-full text-sm">
                                    <thead className="bg-gray-100"><tr><th className="px-4 py-2 text-left">Client</th><th className="px-4 py-2 text-left">SKU</th><th className="px-4 py-2 text-right">Exp</th><th className="px-4 py-2 text-right">Act</th><th className="px-4 py-2 text-right">Var</th>{months.length > 0 && <th className="px-4 py-2 text-right">MoM</th>}<th className="px-4 py-2 text-right">Exp $</th><th className="px-4 py-2 text-right">Sug $</th><th className="px-4 py-2 text-right">QB Adj</th><th className="px-4 py-2 text-right">Cost</th><th className="px-4 py-2 text-right">Margin</th></tr></thead>
                                    <tbody>
                                        {withTrends.map((r, i) => (
                                            <tr key={i} className="border-b hover:bg-gray-50">
                                                <td className="px-4 py-2 font-medium">{r.clientName}</td>
                                                <td className="px-4 py-2 text-gray-600">{r.sku}</td>
												<td className="px-4 py-2 text-sm text-gray-600">{r.description}</td>
                                                <td className="px-4 py-2 text-right">{r.expectedQty}</td>
                                                <td className="px-4 py-2 text-right font-medium">{r.actualQty}</td>
                                                <td className="px-4 py-2 text-right"><span className={r.variance > 0 ? 'text-red-600' : r.variance < 0 ? 'text-green-600' : 'text-gray-600'}>{r.variance}</span></td>
                                                {months.length > 0 && <td className="px-4 py-2 text-right">{r.trend === 'new' ? <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">NEW</span> : r.trend === 'up' ? <span className="text-orange-600">+{r.trendQty} ({r.trendPct.toFixed(0)}%)</span> : r.trend === 'down' ? <span className="text-blue-600">{r.trendQty} ({r.trendPct.toFixed(0)}%)</span> : <span className="text-gray-500">—</span>}</td>}
                                                <td className="px-4 py-2 text-right">${r.expectedRevenue.toFixed(2)}</td>
                                                <td className="px-4 py-2 text-right font-medium">${r.suggestedRevenue.toFixed(2)}</td>
                                                <td className="px-4 py-2 text-right"><span className={`font-bold ${r.revenueAdjustment > 0 ? 'text-green-600' : r.revenueAdjustment < 0 ? 'text-red-600' : 'text-gray-600'}`}>{r.revenueAdjustment >= 0 ? '+' : ''}${r.revenueAdjustment.toFixed(2)}</span></td>
                                                <td className="px-4 py-2 text-right">${r.actualCost.toFixed(2)}</td>
                                                <td className="px-4 py-2 text-right text-green-600 font-medium">${r.margin.toFixed(2)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<SophosTracker />);
    </script>
</body>
</html>
