<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophos Usage Tracker - Rolling 12 Months</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }
        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: slideIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // SVG Icons
        const Upload = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12' })
            )
        );

        const Download = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4' })
            )
        );

        const Calendar = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' })
            )
        );

        const TrendingUp = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' })
            )
        );

        const TrendingDown = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M13 17h8m0 0V9m0 8l-8-8-4 4-6-6' })
            )
        );

        const Minus = ({ className }) => (
            React.createElement('svg', { className: className, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M20 12H4' })
            )
        );

        // Utility functions
        const parseMonthLabel = (label) => {
            const match = label.match(/Sophos-(\d{2})(\d{2})/);
            if (!match) return null;
            const month = parseInt(match[1], 10);
            const year = 2000 + parseInt(match[2], 10);
            return new Date(year, month - 1);
        };

        const formatMonthLabel = (date) => {
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = String(date.getFullYear()).slice(-2);
            return `Sophos-${month}${year}`;
        };

        const formatMonthDisplay = (label) => {
            const date = parseMonthLabel(label);
            if (!date) return label;
            return date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        };

        const getLast12Months = (historicalData) => {
            const allMonths = Object.keys(historicalData)
                .map(label => ({ label, date: parseMonthLabel(label) }))
                .filter(item => item.date !== null)
                .sort((a, b) => b.date - a.date)
                .slice(0, 12)
                .reverse();
            return allMonths;
        };

        const SophosUsageTracker = () => {
            const [invoiceData, setInvoiceData] = useState([]);
            const [clientSkuConfig, setClientSkuConfig] = useState([]);
            const [newClientSku, setNewClientSku] = useState({
                clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0
            });
            const [uploadError, setUploadError] = useState('');
            const [currentMonthLabel, setCurrentMonthLabel] = useState('');
            const [historicalData, setHistoricalData] = useState({});
            const [configExpanded, setConfigExpanded] = useState(true);
            const [clientFilter, setClientFilter] = useState('');

            useEffect(() => {
                const saved = localStorage.getItem('sophosHistoricalData');
                if (saved) {
                    try {
                        setHistoricalData(JSON.parse(saved));
                    } catch (e) {
                        console.error('Error loading historical data:', e);
                    }
                }

                const savedConfig = localStorage.getItem('sophosClientSkuConfig');
                if (savedConfig) {
                    try {
                        setClientSkuConfig(JSON.parse(savedConfig));
                    } catch (e) {
                        console.error('Error loading client config:', e);
                    }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('sophosClientSkuConfig', JSON.stringify(clientSkuConfig));
            }, [clientSkuConfig]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploadError('');
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const text = event.target.result;
                            const rows = text.split('\n').map(r => r.trim()).filter(r => r);
                            
                            if (rows.length < 2) {
                                setUploadError('CSV must have at least a header row and one data row.');
                                return;
                            }

                            // Parse CSV with proper quote handling
                            const parseCSVRow = (row) => {
                                const result = [];
                                let current = '';
                                let inQuotes = false;
                                
                                for (let i = 0; i < row.length; i++) {
                                    const char = row[i];
                                    if (char === '"') {
                                        inQuotes = !inQuotes;
                                    } else if (char === ',' && !inQuotes) {
                                        result.push(current.trim());
                                        current = '';
                                    } else {
                                        current += char;
                                    }
                                }
                                result.push(current.trim());
                                return result;
                            };

                            const headers = parseCSVRow(rows[0]);
                            
                            // Try to find the right columns (case-insensitive, with fallbacks)
                            const findColumnIndex = (possibleNames) => {
                                for (const name of possibleNames) {
                                    const idx = headers.findIndex(h => h.toLowerCase() === name.toLowerCase());
                                    if (idx !== -1) return idx;
                                }
                                return -1;
                            };

                            const clientIdx = findColumnIndex(['End User Name', 'Client', 'Customer', 'End User']);
                            const skuIdx = findColumnIndex(['Sku', 'SKU', 'Product SKU']);
                            const qtyIdx = findColumnIndex(['Qty', 'Quantity']);
                            const costIdx = findColumnIndex(['Ext Price', 'Extended Price', 'Cost', 'Total', 'Total Price']);

                            if (clientIdx === -1 || skuIdx === -1 || qtyIdx === -1 || costIdx === -1) {
                                setUploadError(`CSV missing required columns. Found: ${headers.join(', ')}`);
                                return;
                            }

                            const data = [];
                            for (let i = 1; i < rows.length; i++) {
                                const cols = parseCSVRow(rows[i]);
                                if (cols.length < 4) continue;
                                
                                const client = cols[clientIdx] || '';
                                const sku = cols[skuIdx] || '';
                                const qty = parseFloat(cols[qtyIdx]) || 0;
                                const cost = parseFloat(cols[costIdx]) || 0;

                                if (client && sku) {
                                    data.push({ client, sku, qty, cost });
                                }
                            }

                            setInvoiceData(data);
                        } catch (error) {
                            setUploadError('Error parsing CSV: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const handleAddClientSku = () => {
                if (newClientSku.clientName && newClientSku.sku) {
                    setClientSkuConfig([...clientSkuConfig, { ...newClientSku }]);
                    setNewClientSku({
                        clientName: '', sku: '', description: '', trackUsage: true, expectedQty: 0, billingRate: 0
                    });
                }
            };

            const handleRemoveClientSku = (index) => {
                setClientSkuConfig(clientSkuConfig.filter((_, i) => i !== index));
            };

            const handleSaveMonth = () => {
                if (!currentMonthLabel) {
                    alert('Please enter a month label (e.g., Sophos-0126)');
                    return;
                }

                const snapshot = {};
                invoiceData.forEach(item => {
                    const key = `${item.client}|||${item.sku}`;
                    snapshot[key] = item.qty;
                });

                const updated = { ...historicalData, [currentMonthLabel]: snapshot };
                setHistoricalData(updated);
                localStorage.setItem('sophosHistoricalData', JSON.stringify(updated));
                alert(`Saved month: ${currentMonthLabel}`);
            };

            const handleExportConfig = () => {
                const dataStr = JSON.stringify(clientSkuConfig, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sophos-config.json';
                a.click();
            };

            const handleImportConfig = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const config = JSON.parse(event.target.result);
                            setClientSkuConfig(config);
                        } catch (error) {
                            alert('Error parsing config file: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const rolling12Months = useMemo(() => getLast12Months(historicalData), [historicalData]);

            const analysisData = useMemo(() => {
                if (invoiceData.length === 0 || clientSkuConfig.length === 0) return [];

                const result = [];
                clientSkuConfig.forEach(config => {
                    if (!config.trackUsage) return;

                    const invoice = invoiceData.find(
                        i => i.client === config.clientName && i.sku === config.sku
                    );

                    const actualQty = invoice ? invoice.qty : 0;
                    const actualCost = invoice ? invoice.cost : 0;
                    const variance = actualQty - (config.expectedQty || 0);
                    const revenueAdjustment = variance * (config.billingRate || 0);
                    const margin = revenueAdjustment - actualCost;

                    // Get historical data for rolling 12 months
                    const monthlyQty = {};
                    rolling12Months.forEach(({ label }) => {
                        const snapshot = historicalData[label] || {};
                        const key = `${config.clientName}|||${config.sku}`;
                        monthlyQty[label] = snapshot[key] || 0;
                    });

                    // Get last month qty for trend
                    let lastMonthQty = undefined;
                    if (rolling12Months.length > 0) {
                        const lastMonth = rolling12Months[rolling12Months.length - 1].label;
                        const snapshot = historicalData[lastMonth] || {};
                        const key = `${config.clientName}|||${config.sku}`;
                        lastMonthQty = snapshot[key];
                    }

                    let trend = 'none';
                    let trendQty = 0;
                    if (lastMonthQty !== undefined) {
                        if (actualQty > lastMonthQty) {
                            trend = 'up';
                            trendQty = actualQty - lastMonthQty;
                        } else if (actualQty < lastMonthQty) {
                            trend = 'down';
                            trendQty = actualQty - lastMonthQty;
                        } else {
                            trend = 'stable';
                        }
                    } else if (actualQty > 0) {
                        trend = 'new';
                    }

                    result.push({
                        clientName: config.clientName,
                        sku: config.sku,
                        description: config.description,
                        expectedQty: config.expectedQty,
                        billingRate: config.billingRate,
                        actualQty,
                        actualCost,
                        variance,
                        revenueAdjustment,
                        margin,
                        lastMonthQty,
                        trend,
                        trendQty,
                        monthlyQty
                    });
                });

                return result;
            }, [invoiceData, clientSkuConfig, historicalData, rolling12Months]);

            const filteredData = useMemo(() => {
                if (!clientFilter) return analysisData;
                const lower = clientFilter.toLowerCase();
                return analysisData.filter(row => 
                    row.clientName.toLowerCase().includes(lower) ||
                    row.description.toLowerCase().includes(lower) ||
                    row.sku.toLowerCase().includes(lower)
                );
            }, [analysisData, clientFilter]);

            const filteredTotals = useMemo(() => {
                return filteredData.reduce((acc, row) => ({
                    totalRevenue: acc.totalRevenue + row.revenueAdjustment,
                    totalCost: acc.totalCost + row.actualCost,
                    totalMargin: acc.totalMargin + row.margin
                }), { totalRevenue: 0, totalCost: 0, totalMargin: 0 });
            }, [filteredData]);

            return React.createElement('div', { className: 'min-h-screen p-6' },
                React.createElement('div', { className: 'max-w-[98%] mx-auto space-y-6' },
                    // Header
                    React.createElement('div', { className: 'glass rounded-2xl p-8 glow animate-in' },
                        React.createElement('div', { className: 'flex items-center gap-4 mb-2' },
                            React.createElement(Calendar, { className: 'w-10 h-10 text-sky-400' }),
                            React.createElement('h1', { className: 'text-4xl font-bold text-white' }, 'Sophos Usage Tracker')
                        ),
                        React.createElement('p', { className: 'text-sky-200 text-lg' }, 'Rolling 12-Month Analysis & QuickBooks Adjustment Calculator')
                    ),

                    // Upload Section
                    React.createElement('div', { className: 'glass rounded-2xl p-6 animate-in', style: { animationDelay: '0.1s' } },
                        React.createElement('h2', { className: 'text-xl font-semibold text-white mb-4 flex items-center gap-2' },
                            React.createElement(Upload, { className: 'w-5 h-5 text-sky-400' }),
                            'Upload Invoice CSV'
                        ),
                        React.createElement('div', { className: 'space-y-4' },
                            React.createElement('div', { className: 'flex gap-4 items-end' },
                                React.createElement('div', { className: 'flex-1' },
                                    React.createElement('label', { className: 'block text-sm text-sky-200 mb-2' }, 'CSV File (End User Name, Sku, Qty, Ext Price)'),
                                    React.createElement('input', {
                                        type: 'file',
                                        accept: '.csv',
                                        onChange: handleFileUpload,
                                        className: 'w-full px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-sky-400'
                                    })
                                ),
                                React.createElement('div', { className: 'flex-1' },
                                    React.createElement('label', { className: 'block text-sm text-sky-200 mb-2 mono' }, 'Month Label (e.g., Sophos-0126)'),
                                    React.createElement('input', {
                                        type: 'text',
                                        value: currentMonthLabel,
                                        onChange: (e) => setCurrentMonthLabel(e.target.value),
                                        placeholder: 'Sophos-0126',
                                        className: 'w-full px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white mono focus:outline-none focus:ring-2 focus:ring-sky-400'
                                    })
                                ),
                                React.createElement('button', {
                                    onClick: handleSaveMonth,
                                    disabled: invoiceData.length === 0 || !currentMonthLabel,
                                    className: 'px-6 py-2 bg-sky-600 hover:bg-sky-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-lg font-medium transition-colors'
                                }, 'Save Month')
                            ),
                            uploadError && React.createElement('div', { className: 'p-3 bg-red-900/30 border border-red-500 rounded-lg text-red-200 text-sm' }, uploadError),
                            invoiceData.length > 0 && React.createElement('div', { className: 'p-3 bg-emerald-900/30 border border-emerald-500 rounded-lg text-emerald-200 text-sm' }, 
                                `Loaded ${invoiceData.length} invoice items`
                            )
                        )
                    ),

                    // Client SKU Configuration
                    React.createElement('div', { className: 'glass rounded-2xl p-6 animate-in', style: { animationDelay: '0.2s' } },
                        React.createElement('div', { className: 'flex justify-between items-center mb-4' },
                            React.createElement('h2', { className: 'text-xl font-semibold text-white' }, 'Client SKU Configuration'),
                            React.createElement('div', { className: 'flex gap-2' },
                                React.createElement('label', { className: 'px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg cursor-pointer transition-colors' },
                                    'Import Config',
                                    React.createElement('input', { type: 'file', accept: '.json', onChange: handleImportConfig, className: 'hidden' })
                                ),
                                React.createElement('button', {
                                    onClick: handleExportConfig,
                                    className: 'px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors flex items-center gap-2'
                                },
                                    React.createElement(Download, { className: 'w-4 h-4' }),
                                    'Export Config'
                                ),
                                React.createElement('button', {
                                    onClick: () => setConfigExpanded(!configExpanded),
                                    className: 'px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors'
                                }, configExpanded ? 'Collapse' : 'Expand')
                            )
                        ),

                        configExpanded && React.createElement('div', { className: 'space-y-4' },
                            // Add new Client SKU
                            React.createElement('div', { className: 'grid grid-cols-7 gap-3 p-4 bg-slate-800/50 rounded-lg' },
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Client Name',
                                    value: newClientSku.clientName,
                                    onChange: (e) => setNewClientSku({...newClientSku, clientName: e.target.value}),
                                    className: 'px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-400'
                                }),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'SKU',
                                    value: newClientSku.sku,
                                    onChange: (e) => setNewClientSku({...newClientSku, sku: e.target.value}),
                                    className: 'px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm mono focus:outline-none focus:ring-2 focus:ring-sky-400'
                                }),
                                React.createElement('input', {
                                    type: 'text',
                                    placeholder: 'Description',
                                    value: newClientSku.description,
                                    onChange: (e) => setNewClientSku({...newClientSku, description: e.target.value}),
                                    className: 'px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-400'
                                }),
                                React.createElement('input', {
                                    type: 'number',
                                    placeholder: 'Expected Qty',
                                    value: newClientSku.expectedQty || '',
                                    onChange: (e) => setNewClientSku({...newClientSku, expectedQty: parseFloat(e.target.value) || 0}),
                                    className: 'px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm mono focus:outline-none focus:ring-2 focus:ring-sky-400'
                                }),
                                React.createElement('input', {
                                    type: 'number',
                                    placeholder: 'Billing Rate',
                                    value: newClientSku.billingRate || '',
                                    onChange: (e) => setNewClientSku({...newClientSku, billingRate: parseFloat(e.target.value) || 0}),
                                    className: 'px-3 py-2 bg-slate-900 border border-slate-600 rounded text-white text-sm mono focus:outline-none focus:ring-2 focus:ring-sky-400'
                                }),
                                React.createElement('label', { className: 'flex items-center gap-2 text-white text-sm' },
                                    React.createElement('input', {
                                        type: 'checkbox',
                                        checked: newClientSku.trackUsage,
                                        onChange: (e) => setNewClientSku({...newClientSku, trackUsage: e.target.checked}),
                                        className: 'w-4 h-4'
                                    }),
                                    'Track'
                                ),
                                React.createElement('button', {
                                    onClick: handleAddClientSku,
                                    className: 'px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded font-medium transition-colors'
                                }, 'Add')
                            ),

                            // Existing configurations
                            React.createElement('div', { className: 'space-y-2 max-h-96 overflow-y-auto' },
                                clientSkuConfig.map((config, idx) => 
                                    React.createElement('div', { key: idx, className: 'grid grid-cols-7 gap-3 p-3 bg-slate-800/30 rounded-lg items-center text-sm' },
                                        React.createElement('span', { className: 'text-white font-medium' }, config.clientName),
                                        React.createElement('span', { className: 'text-sky-300 mono' }, config.sku),
                                        React.createElement('span', { className: 'text-slate-300' }, config.description),
                                        React.createElement('span', { className: 'text-slate-300 mono' }, config.expectedQty),
                                        React.createElement('span', { className: 'text-emerald-300 mono' }, `$${config.billingRate}`),
                                        React.createElement('span', { className: config.trackUsage ? 'text-emerald-300' : 'text-slate-500' },
                                            config.trackUsage ? '✓ Track' : '✗ Skip'
                                        ),
                                        React.createElement('button', {
                                            onClick: () => handleRemoveClientSku(idx),
                                            className: 'px-3 py-1 bg-red-600/20 hover:bg-red-600/40 text-red-300 rounded transition-colors'
                                        }, 'Remove')
                                    )
                                )
                            )
                        )
                    ),

                    // Analysis Results with Rolling 12 Months
                    invoiceData.length > 0 && clientSkuConfig.length > 0 && React.createElement('div', { className: 'glass rounded-2xl p-6 animate-in', style: { animationDelay: '0.3s' } },
                        React.createElement('div', { className: 'flex justify-between items-center mb-6' },
                            React.createElement('h2', { className: 'text-2xl font-semibold text-white' }, 'Usage Analysis - Rolling 12 Months'),
                            React.createElement('input', {
                                type: 'text',
                                placeholder: 'Filter by client, SKU, or description...',
                                value: clientFilter,
                                onChange: (e) => setClientFilter(e.target.value),
                                className: 'px-4 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white w-80 focus:outline-none focus:ring-2 focus:ring-sky-400'
                            })
                        ),

                        // Summary Cards
                        React.createElement('div', { className: 'grid grid-cols-3 gap-4 mb-6' },
                            React.createElement('div', { className: 'p-4 bg-gradient-to-br from-emerald-900/40 to-emerald-800/20 border border-emerald-500/30 rounded-lg' },
                                React.createElement('p', { className: 'text-sm text-emerald-200 mb-1' }, 'Total Revenue Adjustment'),
                                React.createElement('p', { className: 'text-3xl font-bold text-emerald-300 mono' }, `$${filteredTotals.totalRevenue.toFixed(2)}`)
                            ),
                            React.createElement('div', { className: 'p-4 bg-gradient-to-br from-purple-900/40 to-purple-800/20 border border-purple-500/30 rounded-lg' },
                                React.createElement('p', { className: 'text-sm text-purple-200 mb-1' }, 'Total Cost'),
                                React.createElement('p', { className: 'text-3xl font-bold text-purple-300 mono' }, `$${filteredTotals.totalCost.toFixed(2)}`)
                            ),
                            React.createElement('div', { className: 'p-4 bg-gradient-to-br from-sky-900/40 to-sky-800/20 border border-sky-500/30 rounded-lg' },
                                React.createElement('p', { className: 'text-sm text-sky-200 mb-1' }, 'Total Margin'),
                                React.createElement('p', { className: 'text-3xl font-bold text-sky-300 mono' }, `$${filteredTotals.totalMargin.toFixed(2)}`)
                            )
                        ),

                        filteredData.length === 0 
                            ? React.createElement('div', { className: 'text-center py-12 text-slate-400 text-lg' },
                                `No clients match "${clientFilter}"`
                            )
                            : React.createElement('div', { className: 'overflow-x-auto' },
                                React.createElement('table', { className: 'w-full text-sm' },
                                    React.createElement('thead', { className: 'bg-slate-800/50' },
                                        React.createElement('tr', null,
                                            React.createElement('th', { className: 'px-3 py-3 text-left text-sky-200 font-semibold sticky left-0 bg-slate-800/90 z-10' }, 'Client'),
                                            React.createElement('th', { className: 'px-3 py-3 text-left text-sky-200 font-semibold' }, 'Description'),
                                            rolling12Months.map(({ label }) => 
                                                React.createElement('th', { key: label, className: 'px-3 py-3 text-right text-sky-200 font-semibold mono text-xs' },
                                                    formatMonthDisplay(label)
                                                )
                                            ),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-emerald-300 font-semibold' }, 'Current'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'Expected'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'Variance'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'QB Adj'),
                                            React.createElement('th', { className: 'px-3 py-3 text-right text-sky-200 font-semibold' }, 'Margin')
                                        )
                                    ),
                                    React.createElement('tbody', null,
                                        filteredData.map((row, idx) => 
                                            React.createElement('tr', { key: idx, className: 'border-b border-slate-700/50 hover:bg-slate-800/30 transition-colors' },
                                                React.createElement('td', { className: 'px-3 py-3 font-medium text-white sticky left-0 bg-slate-900/90' }, row.clientName),
                                                React.createElement('td', { className: 'px-3 py-3 text-slate-300', title: `SKU: ${row.sku}` }, row.description || row.sku),
                                                rolling12Months.map(({ label }) => {
                                                    const qty = row.monthlyQty[label] || 0;
                                                    return React.createElement('td', { key: label, className: 'px-3 py-3 text-right text-slate-400 mono' },
                                                        qty > 0 ? qty : '-'
                                                    );
                                                }),
                                                React.createElement('td', { className: 'px-3 py-3 text-right font-bold text-emerald-300 mono' }, row.actualQty),
                                                React.createElement('td', { className: 'px-3 py-3 text-right text-slate-300 mono' }, row.expectedQty || '-'),
                                                React.createElement('td', { className: 'px-3 py-3 text-right mono' },
                                                    React.createElement('span', { 
                                                        className: `flex items-center justify-end gap-1 ${
                                                            row.variance > 0 ? 'text-orange-400' : row.variance < 0 ? 'text-sky-400' : 'text-slate-500'
                                                        }` 
                                                    },
                                                        row.variance > 0 && React.createElement(TrendingUp, { className: 'w-3 h-3' }),
                                                        row.variance < 0 && React.createElement(TrendingDown, { className: 'w-3 h-3' }),
                                                        row.variance
                                                    )
                                                ),
                                                React.createElement('td', { className: 'px-3 py-3 text-right mono' },
                                                    React.createElement('span', { 
                                                        className: `font-bold ${
                                                            row.revenueAdjustment > 0 ? 'text-emerald-400' : row.revenueAdjustment < 0 ? 'text-red-400' : 'text-slate-500'
                                                        }` 
                                                    },
                                                        `${row.revenueAdjustment >= 0 ? '+' : ''}$${row.revenueAdjustment.toFixed(2)}`
                                                    )
                                                ),
                                                React.createElement('td', { className: 'px-3 py-3 text-right text-emerald-400 mono font-medium' }, `$${row.margin.toFixed(2)}`)
                                            )
                                        )
                                    )
                                )
                            ),

                        React.createElement('div', { className: 'mt-6 p-4 bg-slate-800/50 rounded-lg border border-slate-700' },
                            React.createElement('p', { className: 'font-semibold text-sky-200 mb-2' }, 'Column Guide:'),
                            React.createElement('ul', { className: 'space-y-1 text-xs text-slate-300' },
                                React.createElement('li', null,
                                    React.createElement('strong', { className: 'text-sky-300' }, 'Rolling 12 Months:'), ' Historical quantities for up to the last 12 saved months'
                                ),
                                React.createElement('li', null,
                                    React.createElement('strong', { className: 'text-emerald-300' }, 'Current:'), ' Quantity from uploaded invoice | ',
                                    React.createElement('strong', { className: 'text-sky-300' }, 'Expected:'), ' Your planned billing quantity'
                                ),
                                React.createElement('li', null,
                                    React.createElement('strong', { className: 'text-sky-300' }, 'Variance:'), ' Current - Expected | ',
                                    React.createElement('strong', { className: 'text-sky-300' }, 'QB Adj:'), ' Revenue adjustment for QuickBooks'
                                ),
                                React.createElement('li', { className: 'mt-2 pt-2 border-t border-slate-700' },
                                    React.createElement('em', null, 'Tip: Month labels auto-parse from format "Sophos-MMYY" (e.g., Sophos-0126 = Jan 2026)')
                                )
                            )
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(SophosUsageTracker));
    </script>
</body>
</html>
