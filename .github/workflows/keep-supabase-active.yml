name: Keep Supabase Project Active

# Pings the Supabase REST API every 3 days so the free-tier project never
# crosses the "no activity for 7+ days" threshold that triggers auto-pause.
on:
  schedule:
    - cron: '0 12 */3 * *'   # 12:00 UTC, every 3rd day
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/?select=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
