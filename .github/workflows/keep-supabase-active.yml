name: Keep Supabase Project Active (Debug)

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret presence (safe — no values printed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL length: ${#SUPABASE_URL}"
          echo "SUPABASE_URL first 8 chars: ${SUPABASE_URL:0:8}"
          echo "SUPABASE_ANON_KEY length: ${#SUPABASE_ANON_KEY}"

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Full target URL (safe to show, no secret in it): ${SUPABASE_URL}/rest/v1/?select=1"
          curl -v -o /dev/null -w "\nHTTP status: %{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/?select=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
